name: 仙加味 LINE 正式媒體能力驗收（手動）

# 全面整理期間 blocking guards 保持暫停。
# 此 workflow 保留完整驗收能力，但不在 push / PR 自動阻擋新版正確資料。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate current product DM trial authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const current=JSON.parse(fs.readFileSync('assets/data/official-products.json','utf8'));
          const media=JSON.parse(fs.readFileSync('formal-media-authority-v20260810.json','utf8'));
          const trial=JSON.parse(fs.readFileSync('content/trial-campaign-visual.json','utf8'));
          const byId=Object.fromEntries((current.products||[]).map(p=>[p.id,p]));
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const eq=(actual,expected,label)=>must(actual===expected,`${label}: ${actual} !== ${expected}`);

          eq(current.authority,'user-confirmed-current','目前權威');
          eq((current.products||[]).length,6,'正式產品數');
          eq(byId['guilu-drink-30']?.specification,'30cc／罐（小玻璃罐）','30cc主規格');
          eq(byId['guilu-drink-180']?.specification,'180cc／包（鋁袋）','180cc主規格');
          eq(byId['guilu-tangkuai']?.specification,'75g／盒｜8塊裝','湯塊主規格');
          eq(byId['guilu-tangkuai']?.detailUnitApprox,'每塊約9.375g','湯塊詳細約重');
          eq(byId['guilu-jiao']?.specification,'600g（1斤）／盒｜32塊裝','龜鹿膠主規格');
          eq(byId['guilu-jiao']?.detailUnitApprox,'每塊約18.75g','龜鹿膠詳細約重');
          eq(byId['guilu-gao']?.usagePrimary,'每日早上及下午各一小匙','龜鹿膏目前用法');
          must(!/玻璃瓶|30cc／瓶|瓶裝/.test(JSON.stringify(byId['guilu-drink-30'])),'30cc不得稱瓶');

          must(String(current.trialPosterAuthority?.currentDisplay||'').includes('trial-poster-small-boss-official-v20260814.jpg'),'目前試喝權威不是8/14正式海報');
          eq(current.trialPosterAuthority?.doNotRegenerate,true,'試喝禁止重生成');
          must(String(media.source_trial||'').includes('trial-poster-small-boss-official-v20260814.jpg'),'LINE媒體鏡像試喝來源不同步');
          must(String(trial.poster||'').includes('trial-poster-small-boss-official-v20260814.jpg'),'LINE試喝visual不同步');
          must(String(trial.lineCompatiblePoster||'').includes('/assets/formal-trial/trial.jpg'),'LINE試喝相容route缺失');
          must(String(media.source_product_dm?.['龜鹿飲30cc玻璃罐']||'').includes('02_guilu-drink-30cc-dm-official-v20260814.jpg'),'30cc詳細DM不是8/14核准JPG');
          must(String(media.source_product_image?.['龜鹿飲30cc玻璃罐']||'').includes('/images/customer-display-v20260812/guilu-drink-30cc.avif'),'30cc產品圖不是目前正式產品圖');
          must(String(current.displayPolicy||'').includes('三者不可互相取代'),'產品／DM／試喝媒體角色未分離');
          console.log('PASS: current LINE product, DM, trial and identity media authority are aligned.');
          NODE

      - name: Validate current media routes and Flex behavior
        run: |
          node line-health-authority.test.js
          node line-formal-media-route.test.js
          node line-recording-ui-fix.test.js
          node line-direct-start-safety.test.js

      - name: Verify maintenance mode remains nonblocking
        run: |
          node - <<'NODE'
          const mode=require('./guard-mode.json');
          if(mode.mode!=='paused_for_full_system_update'||mode.blocking_runtime_guards!==false||mode.keep_minimum_safety!==true) throw new Error('maintenance guard mode changed unexpectedly');
          console.log('PASS: full media guard remains manual-only during cleanup; minimum runtime safety stays enabled.');
          NODE
