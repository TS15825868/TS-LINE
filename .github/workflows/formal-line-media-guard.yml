name: 仙加味 LINE 正式媒體能力驗收（手動）

# 僅手動驗收，避免不必要的 Actions 消耗。
# 產品規格由目前正式測試負責，本 workflow 只驗媒體角色與可見性，不複製第二套舊規格。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-line-current-media-audit
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate current media authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const current=require('./assets/data/official-products.json');
          const media=require('./formal-media-authority-v20260810.json');
          const photo=require('./line-product-photo-authority.json');
          const trial=require('./content/trial-campaign-visual.json');
          const qixuanId='qixuan-guilu-drink-powder';
          const visibleIds=['guilu-gao','guilu-drink-30','guilu-drink-180','guilu-tangkuai','guilu-jiao','luerong-fen'];
          const byId=Object.fromEntries((current.products||[]).map(p=>[p.id,p]));
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};

          must(current.authority==='user-confirmed-current','目前產品權威錯誤');
          must(JSON.stringify(current.knowledgeProductIds)===JSON.stringify(visibleIds),'LINE目前可見知識應為六項');
          must((current.temporarilyHiddenProductIds||[]).includes(qixuanId),'柒玄茶必須保留暫時隱藏狀態');
          must(byId[qixuanId]?.temporarilyHidden===true&&byId[qixuanId]?.lineKnowledgeVisible===false,'柒玄茶不得在LINE公開知識出現');
          must(!photo.products?.[qixuanId],'柒玄茶未核准正式實物圖時不得建立假圖片權威');
          must(Object.keys(photo.products||{}).length===6,'核准正式實物身份圖必須六項');

          for(const id of visibleIds){
            must(byId[id],`${id} 缺少目前正式產品權威`);
            must(String(byId[id].approvedProductImage||'').trim(),`${id} 缺少正式產品圖`);
            must(String(byId[id].approvedDm||'').includes('/images/dm-final/'),`${id} 詳細DM不是目前正式來源`);
            must(String(photo.products?.[id]||'').includes('/images/products-v3/'),`${id} products-v3身份權威錯誤`);
          }

          must(String(current.trialPosterAuthority?.currentDisplay||'').includes('trial-poster-small-boss-official-v20260814.jpg'),'試喝主圖不是目前核准海報');
          must(current.trialPosterAuthority?.doNotRegenerate===true,'試喝主圖不得自動重生成');
          must(String(media.source_trial||'').includes('trial-poster-small-boss-official-v20260814.jpg'),'媒體鏡像試喝來源不同步');
          must(String(trial.lineCompatiblePoster||'').includes('/assets/formal-trial/trial.jpg'),'LINE試喝JPEG route缺失');
          must((media.hard_rules||[]).some(x=>String(x).includes('AI不得重畫正式產品本體')),'禁止AI重畫正式產品規則缺失');
          console.log('PASS: six visible products, Qixuan hidden, product/DM/trial/identity media roles separated.');
          NODE

      - name: Validate media routes and Flex behavior
        run: |
          node line-health-authority.test.js
          node line-formal-media-route.test.js
          node line-recording-ui-fix.test.js
          node line-direct-start-safety.test.js
          node line-products-v3-authority.test.js
          node line-true-original-readiness.test.js

      - name: Ensure audit is read-only
        run: |
          git diff --exit-code
