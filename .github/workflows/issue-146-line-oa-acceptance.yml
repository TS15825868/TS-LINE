name: LINE OA Issue 146 正式驗收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'line-image-safety.js'
      - 'line-oa-issue146-flow.test.js'
      - 'social-current-policy.test.js'
      - 'data.json'
      - 'line-sales-master.json'
      - 'public/mascot/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/issue-146-line-oa-acceptance.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: line-oa-issue-146-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Verify official prices and image routing
        id: policy
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node social-current-policy.test.js

      - name: Verify Carousel, Quick Reply paths, cart, order and service
        id: flow
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node line-oa-issue146-flow.test.js 2>&1 | tee /tmp/issue146-flow.log

      - name: Verify four public official scene images
        id: images
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/TS15825868/TS-LINE/main/public/mascot'
          for name in recommend combo usage faq; do
            file="/tmp/${name}.jpg"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 "${base}/${name}.jpg" --output "$file"
            test "$(wc -c < "$file")" -ge 50000
            head -c 2 "$file" | od -An -tx1 | grep -qi 'ff d8'
          done

      - name: Wait for Render deployment and verify health
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          url='https://ts-line.onrender.com/healthz'
          body=''
          for attempt in $(seq 1 18); do
            if body=$(curl --fail --location --silent --show-error --max-time 40 "$url" 2>/dev/null); then
              if printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q '"orderOpen":true'; then
                printf '%s\n' "$body"
                exit 0
              fi
            fi
            echo "等待 Render 正式部署（${attempt}/18）"
            sleep 20
          done
          echo "Render healthz 尚未通過：${body}"
          exit 1

      - name: Publish detailed acceptance result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ steps.install.outcome }}
          POLICY: ${{ steps.policy.outcome }}
          FLOW: ${{ steps.flow.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          RENDER: ${{ steps.render.outcome }}
        shell: bash
        run: |
          status_icon() {
            if [ "$1" = 'success' ]; then printf '✅';
            elif [ "$1" = 'skipped' ]; then printf '⏭️';
            else printf '❌'; fi
          }
          flow_detail=''
          if [ "$FLOW" != 'success' ] && [ -s /tmp/issue146-flow.log ]; then
            flow_detail=$(tail -n 18 /tmp/issue146-flow.log | sed 's/`/\`/g')
          fi
          body=$(cat <<EOF
          Issue #146 自動驗收結果：

          - $(status_icon "$INSTALL") 套件安裝：$INSTALL
          - $(status_icon "$POLICY") 正式價格、四入口圖品質與場景路由：$POLICY
          - $(status_icon "$FLOW") Carousel、Quick Reply 操作、購物車、數量選擇與人工客服：$FLOW
          - $(status_icon "$IMAGES") 四張正式入口圖公開網址：$IMAGES
          - $(status_icon "$RENDER") Render /healthz 正式網址：$RENDER

          提交：${GITHUB_SHA}
          未啟用任何自動核准、排程或發布。
          EOF
          )
          if [ -n "$flow_detail" ]; then
            body="$body

          流程測試錯誤尾端：
          \`\`\`
          $flow_detail
          \`\`\`"
          fi
          gh issue comment 146 --repo TS15825868/TS-LINE --body "$body"

      - name: Close Issue 146 after full acceptance
        if: steps.install.outcome == 'success' && steps.policy.outcome == 'success' && steps.flow.outcome == 'success' && steps.images.outcome == 'success' && steps.render.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close 146 --repo TS15825868/TS-LINE --reason completed --comment $'Issue #146 正式驗收完成：\n\n- 四張入口圖皆為正式完整圖，公開網址與檔案品質通過\n- 幫我推薦／搭配組合／怎麼使用／常見問題場景路由通過\n- 產品卡維持 products-v3 真實產品原圖、fit 等比例、不被小老闆圖覆蓋\n- Carousel 上限、操作按鈕、購物車、數量選擇與人工客服流程通過\n- Render /healthz 正式網址通過\n\n未啟用任何自動發布或未授權動作。'

      - name: Fail workflow when any acceptance stage failed
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          POLICY: ${{ steps.policy.outcome }}
          FLOW: ${{ steps.flow.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          RENDER: ${{ steps.render.outcome }}
        shell: bash
        run: |
          test "$INSTALL" = 'success'
          test "$POLICY" = 'success'
          test "$FLOW" = 'success'
          test "$IMAGES" = 'success'
          test "$RENDER" = 'success'

