name: LINE OA Issue 146 正式驗收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'line-image-safety.js'
      - 'line-oa-issue146-flow.test.js'
      - 'social-current-policy.test.js'
      - 'data.json'
      - 'line-sales-master.json'
      - 'public/mascot/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/issue-146-line-oa-acceptance.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: line-oa-issue-146-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify official prices and image routing
        run: node social-current-policy.test.js

      - name: Verify Carousel, Quick Reply paths, cart, order and service
        run: node line-oa-issue146-flow.test.js

      - name: Verify four public official scene images
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/TS15825868/TS-LINE/main/public/mascot'
          for name in recommend combo usage faq; do
            file="/tmp/${name}.jpg"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 "${base}/${name}.jpg" --output "$file"
            test "$(wc -c < "$file")" -ge 50000
            head -c 2 "$file" | od -An -tx1 | grep -qi 'ff d8'
          done

      - name: Wait for Render deployment and verify health
        shell: bash
        run: |
          set -euo pipefail
          url='https://ts-line.onrender.com/healthz'
          body=''
          for attempt in $(seq 1 18); do
            if body=$(curl --fail --location --silent --show-error --max-time 40 "$url" 2>/dev/null); then
              if printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q '"orderOpen":true'; then
                printf '%s\n' "$body"
                exit 0
              fi
            fi
            echo "等待 Render 正式部署（${attempt}/18）"
            sleep 20
          done
          echo "Render healthz 尚未通過：${body}"
          exit 1

      - name: Close Issue 146 after full acceptance
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close 146 --repo TS15825868/TS-LINE --reason completed --comment $'Issue #146 正式驗收完成：\n\n- 四張入口圖皆為正式完整圖，公開網址與檔案品質通過\n- 幫我推薦／搭配組合／怎麼使用／常見問題場景路由通過\n- 產品卡維持 products-v3 真實產品原圖、fit 等比例、不被小老闆圖覆蓋\n- Carousel 上限、操作按鈕、購物車、數量選擇與人工客服流程通過\n- Render /healthz 正式網址通過\n\n未啟用任何自動發布或未授權動作。'
