name: 待審安全閘門 v5 驗收更新

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-review-gate-v5.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update hard-coded review gate verification version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = "2026-07-25-review-gate-v4"
          new = "2026-07-26-review-gate-v5"
          allowed = {".js", ".yml", ".yaml", ".md"}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in allowed:
                  continue
              if path.as_posix() == '.github/workflows/migrate-review-gate-v5.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(path.as_posix())
          print('updated:', ', '.join(changed) if changed else 'none')
          PY
          git rm .github/workflows/migrate-review-gate-v5.yml

      - name: Save migration to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: align verification with review gate v5"
          git pull --rebase origin main
          git push origin HEAD:main
