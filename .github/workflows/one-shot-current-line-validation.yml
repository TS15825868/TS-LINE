name: 仙加味 LINE 目前正式版一次性驗收

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-current-line-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full current LINE OA tests
        run: npm test
      - name: Verify current catalog
        run: npm run check:catalog
      - name: Run full manual guard contract
        run: npm run guard:full
      - name: Confirm validation only
        run: |
          echo 'PASS: repository validation only; no Render deploy, no LINE API write, no customer data mutation.'
