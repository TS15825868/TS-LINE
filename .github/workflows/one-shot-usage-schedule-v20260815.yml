name: 仙加味 LINE 20260815 使用方式一次性更新
# rerun-v2-exact-confirmed-copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-usage-schedule-v20260815.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply exact confirmed usage authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          suffixes={'.js','.mjs','.json','.py','.txt','.md','.yml','.yaml'}
          replacements=[
            ('一般建議早上與下午各一小匙','可依個人使用習慣與作息時間安排'),
            ('建議早上與下午各一小匙','可依個人使用習慣與作息時間安排'),
            ('每日早上及下午各一小匙','可依個人使用習慣與作息時間安排'),
            ('建議白天飲用','可依個人使用習慣與作息時間飲用'),
            ('每日一罐','每日 1-2罐'),('每日1罐','每日 1-2罐'),('每日 1 罐','每日 1-2罐'),
            ('每日1～2罐','每日 1-2罐'),('每日 1～2罐','每日 1-2罐'),
            ('避免接近睡前食用','可依個人使用習慣與作息時間安排'),
          ]
          for rel in subprocess.check_output(['git','ls-files'],text=True).splitlines():
            if rel.startswith('.github/') or Path(rel).suffix.lower() not in suffixes: continue
            p=Path(rel)
            try: old=p.read_text(encoding='utf-8')
            except Exception: continue
            new=old
            for a,b in replacements: new=new.replace(a,b)
            if new!=old: p.write_text(new,encoding='utf-8')

          p=Path('line-sales-master.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['version']='2026-08-15-canonical-v8-usage-schedule'
          products=data['products']
          products['guilu-gao']['usage']=[
            '可依個人使用習慣與作息時間安排',
            '初次可先從半匙開始',
            '可直接食用或加入約100～300mL熱水化開'
          ]
          products['guilu-drink-30']['usage']=[
            '每日 1-2罐',
            '開罐即可飲用',
            '可隔水加熱或溫熱後飲用',
            '可依個人使用習慣與作息時間飲用',
            '避免冰飲',
            '開罐後請儘速飲用完畢'
          ]
          products['guilu-drink-180']['usage']=[
            '每日一包',
            '撕開包裝即可飲用',
            '可隔水加熱或溫熱後飲用',
            '可依個人使用習慣與作息時間飲用',
            '避免冰飲',
            '開封後請儘速飲用完畢'
          ]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          master=p.read_text(encoding='utf-8')
          assert '每日 1-2罐' in master
          assert '每日一包' in master
          assert '建議白天飲用' not in master
          assert '每日早上及下午各一小匙' not in master
          assert '可依個人使用習慣與作息時間安排' in master
          assert '可依個人使用習慣與作息時間飲用' in master
          PY
      - name: Sync derived product data
        run: node tools/sync_sales_master_current.js
      - name: Validate LINE runtime
        run: |
          npm ci
          npm test
      - name: Commit verified regular files
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github || true
          if git diff --cached --quiet; then echo 'No verified regular-file changes to commit'; exit 0; fi
          git commit -m 'fix(line): align product usage with personal schedules'
          git push origin HEAD:main
