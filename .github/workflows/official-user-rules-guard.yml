name: 仙加味 LINE OA 正式規則自動守門
run-name: LINE OA 正式規則守門｜30cc玻璃罐・買10送1・5至7工作天出貨

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-user-rules-guard.yml'
      - '.github/workflows/catalog-sync.yml'
      - 'tools/finalize-evergreen-trial-buy10get1-v412.mjs'
      - 'tools/finalize-trial-production-lead-time-v415.mjs'
      - 'tools/repair-evergreen-trial-tests.mjs'
      - 'tools/sync_website_catalog.js'
      - 'tools/sync_sales_master.js'
      - 'package.json'
      - 'data.json'
      - 'line-sales-master.json'

permissions:
  contents: write

concurrency:
  group: line-official-user-rules-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repair all confirmed source rules
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const official = '資料及運費確認完成後採接單安排製作，約5～7個工作天出貨，不含例假日及物流配送時間';
          const finalizerPath = 'tools/finalize-evergreen-trial-buy10get1-v412.mjs';
          let source = fs.readFileSync(finalizerPath, 'utf8');
          source = source
            .replace(/const OFFICIAL_FULFILLMENT = '[^']*';/, `const OFFICIAL_FULFILLMENT = '${official}';`)
            .replace(/^const LEAD_TIME_DEFINITION = .*\n/m, '')
            .replace(/^\s*pkg\.version\s*=\s*['"][^'"]+['"];\s*\n/m, '')
            .replace(/pkg\.description = '[^']*';/, "pkg.description = '仙加味 LINE OA 正式版｜30cc三罐試喝品免費、運費自付｜30cc與180cc買10送1｜接單後安排製作，約5～7個工作天出貨｜人工審核後發布';")
            .replaceAll('資料及運費確認後安排製作加工，製作加工約需5～7個工作天；完成後才安排出貨，物流配送時間另計', official)
            .replaceAll('資料及運費確認後安排製作加工，製作加工約需5～7個工作天；完成後才安排出貨，另加物流配送時間', official)
            .replaceAll('製作加工約需5～7個工作天；完成後才安排出貨，物流配送時間另計', '約5～7個工作天出貨，不含例假日及物流配送時間')
            .replaceAll('製作加工約需5～7個工作天；完成後才安排出貨，另加物流配送時間', '約5～7個工作天出貨，不含例假日及物流配送時間')
            .replaceAll('5～7個工作天只計製作加工，不含例假日及完成後的物流配送時間', '約5～7個工作天出貨，不含例假日及物流配送時間');
          const verificationIndex = source.indexOf('const verification = JSON.stringify(data);');
          if (verificationIndex < 0) throw new Error('找不到 LINE 正式驗證區塊');
          source = source.slice(0, verificationIndex) + `const verification = JSON.stringify(data);\nfor (const bad of ['買10送2', '共12罐500元', '共12包2,000元', '30cc／瓶（小玻璃瓶）', '製作加工約需5～7個工作天', '5～7個工作天只計製作加工']) {\n  if (verification.includes(bad)) throw new Error(\`LINE母本仍有舊資料：\${bad}\`);\n}\nif (!verification.includes('買10送1') || !verification.includes('約5～7個工作天出貨')) {\n  throw new Error('LINE母本缺少正式活動或出貨規則');\n}\nconsole.log('PASS LINE OA：長期試喝、30cc／180cc買10送1，以及接單後約5～7個工作天出貨規則已完成。');\n`;
          fs.writeFileSync(finalizerPath, source);

          const repairPath = 'tools/repair-evergreen-trial-tests.mjs';
          if (fs.existsSync(repairPath)) {
            let repair = fs.readFileSync(repairPath, 'utf8');
            repair = repair
              .replaceAll('買10送2×1＋單罐×1', '買10送1×1＋單罐×1')
              .replaceAll('買10送2×1', '買10送1×1')
              .replaceAll('買10送2×2', '買10送1×2')
              .replaceAll('12罐500元', '11罐500元')
              .replaceAll('訂單資料與付款方式確認後採接單安排製作，約5～7個工作天出貨；不含例假日及物流配送時間。', `訂單資料與付款方式確認完成後，${official}。`)
              .replaceAll('製作加工約5～7工作天，完成後出貨', '接單後安排製作，約5～7個工作天出貨');
            fs.writeFileSync(repairPath, repair);
          }

          const pkgPath = 'package.json';
          const lockPath = 'package-lock.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          for (const key of Object.keys(pkg.scripts || {})) {
            pkg.scripts[key] = String(pkg.scripts[key]).replace(/\s*&&\s*node tools\/finalize-trial-production-lead-time-v415\.mjs/g, '');
          }
          pkg.version = lock.version;
          pkg.description = '仙加味 LINE OA 正式版｜30cc三罐試喝品免費、運費自付｜30cc與180cc買10送1｜接單後安排製作，約5～7個工作天出貨｜人工審核後發布';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const workflowPath = '.github/workflows/catalog-sync.yml';
          if (fs.existsSync(workflowPath)) {
            let workflow = fs.readFileSync(workflowPath, 'utf8');
            workflow = workflow
              .split('\n').filter((line) => !line.includes('finalize-trial-production-lead-time-v415.mjs')).join('\n')
              .replaceAll('production rules', 'confirmed shipping rules')
              .replaceAll('production lead time', 'confirmed shipping rule')
              .replaceAll("if (!String(data.trialCampaign?.fulfillmentRule || '').includes('製作加工約需5～7個工作天')) throw new Error(`${file} 缺少製作加工天數`);", "if (!String(data.trialCampaign?.fulfillmentRule || '').includes('約5～7個工作天出貨')) throw new Error(`${file} 缺少正式出貨天數`);")
              .replaceAll("if (!String(data.trialCampaign?.fulfillmentRule || '').includes('完成後才安排出貨')) throw new Error(`${file} 缺少完成後才出貨`);", '')
              .replaceAll("['約5～7個工作天出貨','買10送2'", "['製作加工約需5～7個工作天','5～7個工作天只計製作加工','買10送2'")
              .replaceAll('persist verified catalog and production lead time', 'persist verified catalog and confirmed shipping rule');
            fs.writeFileSync(workflowPath, workflow.endsWith('\n') ? workflow : workflow + '\n');
          }

          fs.rmSync('tools/finalize-trial-production-lead-time-v415.mjs', { force: true });
          fs.rmSync('.github/workflows/finalize-trial-production-lead-time-v415.yml', { force: true });
          NODE
          node --check tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node --check tools/repair-evergreen-trial-tests.mjs
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!==l.version)process.exit(1)"

      - name: Synchronize catalog and official sales data
        id: sync
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run sync:catalog 2>&1 | tee /tmp/line-guard-sync.log

      - name: Run complete LINE OA tests
        id: tests
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm test &&
            node test.js &&
            node catalog.test.js &&
            node function.test.js &&
            node line-order-cart.test.js &&
            node internal-inventory-seed.test.js &&
            node internal-order-pricing.test.js &&
            node internal-line-order-sync.test.js
          } 2>&1 | tee /tmp/line-guard-tests.log

      - name: Verify final public contract
        id: contract
        if: steps.sync.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node - <<'NODE' 2>&1 | tee /tmp/line-guard-contract.log
          const fs = require('fs');
          const files = ['data.json', 'line-sales-master.json'];
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const text = JSON.stringify(data);
            const trial = data.trialCampaign || {};
            for (const required of ['30cc小玻璃罐×3罐','試喝品免費','買10送1','約5～7個工作天出貨']) {
              if (!text.includes(required)) throw new Error(`${file} 缺少：${required}`);
            }
            if (!String(trial.fulfillmentRule || '').includes('約5～7個工作天出貨')) throw new Error(`${file} 出貨規則錯誤`);
            for (const bad of ['買10送2','共12罐500元','共12包2,000元','30cc／瓶（小玻璃瓶）','製作加工約需5～7個工作天','5～7個工作天只計製作加工']) {
              if (text.includes(bad)) throw new Error(`${file} 仍含舊資料：${bad}`);
            }
          }
          const d = require('./data.json');
          const byId = new Map(d.products.map((item) => [item.id, item]));
          const d30 = byId.get('guilu-drink-30');
          const d180 = byId.get('guilu-drink-180');
          if (d30.name !== '龜鹿飲30cc玻璃罐' || d30.size !== '30cc／罐（小玻璃罐）' || d30.price !== 50) throw new Error('30cc產品資料錯誤');
          if (d180.name !== '龜鹿飲180cc鋁袋' || d180.price !== 200) throw new Error('180cc產品資料錯誤');
          NODE

      - name: Persist guard result
        if: always()
        shell: bash
        env:
          SYNC_RESULT: ${{ steps.sync.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          CONTRACT_RESULT: ${{ steps.contract.outcome }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          node - <<'NODE'
          const fs = require('fs');
          const readTail = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').split(/\r?\n/).slice(-160).join('\n') : '';
          const results = {
            sync: process.env.SYNC_RESULT || 'skipped',
            tests: process.env.TEST_RESULT || 'skipped',
            contract: process.env.CONTRACT_RESULT || 'skipped'
          };
          const success = Object.values(results).every((value) => value === 'success');
          fs.writeFileSync('diagnostics/official-user-rules-guard.json', JSON.stringify({
            status: success ? 'success' : 'failure',
            checked_at: new Date().toISOString(),
            commit: process.env.GITHUB_SHA || '',
            results,
            products: ['龜鹿飲30cc玻璃罐','龜鹿飲180cc鋁袋'],
            trial: '30cc小玻璃罐3罐免費、運費自付、每位顧客／電話／地址限一次、接單後約5～7個工作天出貨、LINE OA完成',
            promotions: ['30cc買10送1，共11罐500元','180cc買10送1，共11包2,000元'],
            last_error: success ? '' : [readTail('/tmp/line-guard-sync.log'),readTail('/tmp/line-guard-tests.log'),readTail('/tmp/line-guard-contract.log')].filter(Boolean).join('\n---\n').slice(-30000)
          }, null, 2) + '\n');
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/catalog-sync.yml tools/finalize-evergreen-trial-buy10get1-v412.mjs tools/repair-evergreen-trial-tests.mjs package.json diagnostics/official-user-rules-guard.json
          git add -A tools/finalize-trial-production-lead-time-v415.mjs .github/workflows/finalize-trial-production-lead-time-v415.yml
          if [ "$SYNC_RESULT" = success ] && [ "$TEST_RESULT" = success ] && [ "$CONTRACT_RESULT" = success ]; then
            rm -f ci-last-error.txt
            git add -A data.json line-sales-master.json server.js test.js function.test.js catalog.test.js README.md ci-last-error.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(line): persist official user rules guard ${CONTRACT_RESULT}"
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi

      - name: Fail only after diagnostics are saved
        if: always()
        shell: bash
        env:
          SYNC_RESULT: ${{ steps.sync.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          CONTRACT_RESULT: ${{ steps.contract.outcome }}
        run: |
          test "$SYNC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$CONTRACT_RESULT" = success
