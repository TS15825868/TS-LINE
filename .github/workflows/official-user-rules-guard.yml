name: 仙加味 LINE OA 正式規則自動守門
run-name: LINE OA 正式規則守門｜30cc玻璃罐・買10送1・製作完成後出貨

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-user-rules-guard.yml'
      - '.github/workflows/catalog-sync.yml'
      - 'tools/finalize-evergreen-trial-buy10get1-v412.mjs'
      - 'tools/finalize-trial-production-lead-time-v415.mjs'
      - 'tools/repair-evergreen-trial-tests.mjs'
      - 'data.json'
      - 'line-sales-master.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: line-official-user-rules-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply confirmed product, offer and production rules
        run: |
          node tools/repair-evergreen-trial-tests.mjs
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
          if [ -f tools/finalize-trial-production-lead-time-v415.mjs ]; then
            node tools/finalize-trial-production-lead-time-v415.mjs
          fi

      - name: Synchronize catalog
        run: npm run sync:catalog

      - name: Reapply confirmed rules after synchronization
        run: |
          node tools/repair-evergreen-trial-tests.mjs
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
          if [ -f tools/finalize-trial-production-lead-time-v415.mjs ]; then
            node tools/finalize-trial-production-lead-time-v415.mjs
          fi

      - name: Run complete LINE OA validation
        run: |
          npm test
          node test.js
          node catalog.test.js
          node function.test.js
          node line-order-cart.test.js
          node internal-inventory-seed.test.js
          node internal-order-pricing.test.js
          node internal-line-order-sync.test.js

      - name: Verify final public contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['data.json', 'line-sales-master.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const text = JSON.stringify(data);
            const trial = data.trialCampaign || {};
            for (const required of [
              '30cc小玻璃罐×3罐', '試喝品免費', '買10送1',
              '製作加工約需5～7個工作天', '完成後才安排出貨'
            ]) {
              if (!text.includes(required)) throw new Error(`${file} 缺少正式內容：${required}`);
            }
            for (const legacy of [
              '買10送2', '共12罐500元', '共12包2,000元',
              '30cc／瓶（小玻璃瓶）', '約5～7個工作天出貨'
            ]) {
              if (text.includes(legacy)) throw new Error(`${file} 仍含舊內容：${legacy}`);
            }
            const fulfillment = String(trial.fulfillmentRule || '');
            if (!fulfillment.includes('製作加工約需5～7個工作天') || !fulfillment.includes('完成後才安排出貨')) {
              throw new Error(`${file} 製作與出貨規則不正確`);
            }
          }
          const data = require('./data.json');
          const byId = new Map(data.products.map((item) => [item.id, item]));
          const d30 = byId.get('guilu-drink-30');
          const d180 = byId.get('guilu-drink-180');
          if (d30?.name !== '龜鹿飲30cc玻璃罐' || d30?.size !== '30cc／罐（小玻璃罐）' || d30?.price !== 50) throw new Error('30cc正式資料錯誤');
          if (d180?.name !== '龜鹿飲180cc鋁袋' || d180?.price !== 200) throw new Error('180cc正式資料錯誤');
          NODE
          git diff --check

      - name: Persist verified official rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('diagnostics/official-user-rules-guard.json', JSON.stringify({
            status: 'success',
            checked_at: new Date().toISOString(),
            products: ['龜鹿飲30cc玻璃罐', '龜鹿飲180cc鋁袋'],
            trial: '30cc小玻璃罐3罐免費；運費自付；每位顧客、電話、地址限一次',
            promotions: ['30cc買10送1，共11罐500元', '180cc買10送1，共11包2,000元'],
            fulfillment: '製作加工約需5～7個工作天；完成後才安排出貨，物流配送時間另計'
          }, null, 2) + '\n');
          NODE
          rm -f ci-last-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json line-sales-master.json server.js README.md package.json package-lock.json
          git add tools/finalize-evergreen-trial-buy10get1-v412.mjs tools/repair-evergreen-trial-tests.mjs diagnostics/official-user-rules-guard.json
          git add -A ci-last-error.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(line): persist verified production-before-shipping rules'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
