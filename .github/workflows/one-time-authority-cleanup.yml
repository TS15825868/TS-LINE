name: 單次LINE OA正式資料清理（完成後自刪）

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-authority-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 清理舊規格並統一正式主檔
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          old_long = '600g／盒（1斤）｜32塊裝｜每塊約18.75g'
          new_long = '600g（1斤）／盒｜32塊裝｜每塊約18.75g'
          old_short = '600g／盒（1斤）'
          new_short = '600g（1斤）／盒'
          suffixes = {'.json','.js','.mjs','.cjs','.txt','.md','.yml','.yaml','.html','.sql'}
          changed = []
          for path in Path('.').rglob('*'):
            if not path.is_file() or path.suffix.lower() not in suffixes:
              continue
            if '.git' in path.parts or 'node_modules' in path.parts:
              continue
            if path.as_posix() == '.github/workflows/one-time-authority-cleanup.yml':
              continue
            text = path.read_text(encoding='utf-8', errors='ignore')
            updated = text.replace(old_long, new_long).replace(old_short, new_short)
            if updated != text:
              path.write_text(updated, encoding='utf-8')
              changed.append(path.as_posix())

          for rel in ['config/official-products.json','assets/data/official-products.json']:
            path = Path(rel)
            if not path.exists(): continue
            data = json.loads(path.read_text(encoding='utf-8'))
            for item in data.get('products', []):
              if item.get('id') == 'guilu-jiao':
                for key in ('spec','specification','size'):
                  if key in item: item[key] = new_long
            forbidden = [value for value in data.get('forbidden', []) if value not in {new_long,new_short}]
            if old_long not in forbidden: forbidden.append(old_long)
            data['forbidden'] = forbidden
            data['version'] = '2026-08-05-user-authority-v4'
            path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          master_path = Path('line-sales-master.json')
          master = json.loads(master_path.read_text(encoding='utf-8'))
          jiao = master.get('products', {}).get('guilu-jiao')
          if not jiao: raise SystemExit('LINE OA缺少龜鹿膠產品')
          jiao['name'] = '龜鹿膠'
          jiao['specification'] = new_long
          jiao['size'] = new_long
          jiao['spec'] = new_long
          jiao['unit'] = '盒'
          jiao['fulfillmentType'] = 'ready-stock'
          jiao['fulfillmentNotice'] = '本產品為預先製作備貨商品；訂單資料與付款方式確認後，依現貨狀況安排出貨，物流配送時間另計。'
          jiao['productionLeadTime'] = None
          jiao['readyStock'] = True
          master_path.write_text(json.dumps(master, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          data_path = Path('data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          products = {item.get('id'): item for item in data.get('products', []) if isinstance(item, dict)}
          expected_ids = {'guilu-gao','guilu-drink-30','guilu-drink-180','guilu-tangkuai','guilu-jiao','luerong-fen'}
          if set(products) != expected_ids:
            raise SystemExit(f'LINE OA產品不是唯一六項：{sorted(products)}')
          p = products['guilu-jiao']
          for key in ('specification','size','spec'):
            if key in p: p[key] = new_long
          p['fulfillmentType'] = 'ready-stock'
          p['fulfillmentNotice'] = '本產品為預先製作備貨商品；訂單資料與付款方式確認後，依現貨狀況安排出貨，物流配送時間另計。'
          p['productionLeadTime'] = None
          p['readyStock'] = True
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          combined = '\n'.join(
            p.read_text(encoding='utf-8', errors='ignore')
            for p in Path('.').rglob('*')
            if p.is_file() and p.suffix.lower() in suffixes and '.git' not in p.parts
            and p.as_posix() != '.github/workflows/one-time-authority-cleanup.yml'
          )
          if old_long in combined or old_short in combined:
            raise SystemExit('LINE OA仍含龜鹿膠舊字序')
          for product_id in ['guilu-gao','guilu-tangkuai','guilu-jiao','luerong-fen']:
            product = data['products'][next(i for i,x in enumerate(data['products']) if x.get('id') == product_id)]
            notice = str(product.get('fulfillmentNotice',''))
            if '5～7個工作天' in notice or product.get('readyStock') is not True:
              raise SystemExit(f'{product_id} 被錯套龜鹿飲交期')

          obsolete = [
            'diagnostics/line-v424-validation.json',
            'diagnostics/line-v426-validation.json',
            'diagnostics/line-v429-authority.json',
            'diagnostics/line-v430-authority.json',
          ]
          for rel in obsolete:
            path = Path(rel)
            if path.exists(): path.unlink()

          Path('.github/workflows/one-time-authority-cleanup.yml').unlink()
          print(f'PASS：LINE OA正式資料清理完成，文字更新 {len(changed)} 個檔案。')
          PY

      - name: 提交清理結果並移除本工作流
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(line): finalize exact six-product authority and remove obsolete data'
          git pull --rebase origin main
          git push origin HEAD:main
