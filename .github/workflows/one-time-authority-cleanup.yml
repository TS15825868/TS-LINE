# trigger: 2026-08-05T19:01+08:00
name: 單次LINE OA正式資料清理（完成後自刪）

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-authority-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 清理舊規格並統一正式主檔
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          old_long = '600g／盒（1斤）｜32塊裝｜每塊約18.75g'
          new_long = '600g（1斤）／盒｜32塊裝｜每塊約18.75g'
          old_short = '600g／盒（1斤）'
          new_short = '600g（1斤）／盒'
          suffixes = {'.json','.js','.mjs','.cjs','.txt','.md','.yml','.yaml','.html','.sql'}
          changed = []
          for path in Path('.').rglob('*'):
            if not path.is_file() or path.suffix.lower() not in suffixes:
              continue
            if '.git' in path.parts or 'node_modules' in path.parts:
              continue
            if path.as_posix() == '.github/workflows/one-time-authority-cleanup.yml':
              continue
            text = path.read_text(encoding='utf-8', errors='ignore')
            updated = text.replace(old_long, new_long).replace(old_short, new_short)
            if updated != text:
              path.write_text(updated, encoding='utf-8')
              changed.append(path.as_posix())

          for rel in ['config/official-products.json','assets/data/official-products.json']:
            path = Path(rel)
            if not path.exists(): continue
            authority = json.loads(path.read_text(encoding='utf-8'))
            for item in authority.get('products', []):
              if item.get('id') == 'guilu-jiao':
                for key in ('spec','specification','size'):
                  if key in item: item[key] = new_long
            forbidden = [value for value in authority.get('forbidden', []) if value not in {new_long,new_short}]
            if old_long not in forbidden: forbidden.append(old_long)
            authority['forbidden'] = forbidden
            authority['version'] = '2026-08-05-user-authority-v4'
            path.write_text(json.dumps(authority, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          drink_ids = {'guilu-drink-30','guilu-drink-180'}
          stock_ids = {'guilu-gao','guilu-tangkuai','guilu-jiao','luerong-fen'}
          drink_notice = '龜鹿飲為接單後安排製作加工；訂單資料與付款方式確認後，製作加工約需5～7個工作天，完成後才安排出貨，物流配送時間另計。'
          stock_notice = '本產品為預先製作備貨商品；訂單資料與付款方式確認後，依現貨狀況安排出貨，物流配送時間另計。'

          master_path = Path('line-sales-master.json')
          master = json.loads(master_path.read_text(encoding='utf-8'))
          master_products = master.get('products', {})
          expected_ids = drink_ids | stock_ids
          if set(master_products) != expected_ids:
            raise SystemExit(f'LINE銷售主檔不是唯一六項：{sorted(master_products)}')
          for product_id, product in master_products.items():
            is_drink = product_id in drink_ids
            product['fulfillmentType'] = 'made-to-order-drink' if is_drink else 'ready-stock'
            product['fulfillmentNotice'] = drink_notice if is_drink else stock_notice
            product['productionLeadTime'] = '5～7個工作天' if is_drink else None
            product['readyStock'] = not is_drink
          jiao = master_products['guilu-jiao']
          jiao.update({'name':'龜鹿膠','specification':new_long,'size':new_long,'spec':new_long,'unit':'盒'})
          master_path.write_text(json.dumps(master, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          data_path = Path('data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data_products = {item.get('id'): item for item in data.get('products', []) if isinstance(item, dict)}
          if set(data_products) != expected_ids:
            raise SystemExit(f'LINE執行資料不是唯一六項：{sorted(data_products)}')
          for product_id, product in data_products.items():
            is_drink = product_id in drink_ids
            product['fulfillmentType'] = 'made-to-order-drink' if is_drink else 'ready-stock'
            product['fulfillmentNotice'] = drink_notice if is_drink else stock_notice
            product['productionLeadTime'] = '5～7個工作天' if is_drink else None
            product['readyStock'] = not is_drink
          jiao = data_products['guilu-jiao']
          jiao['name'] = '龜鹿膠'
          for key in ('specification','size','spec'):
            if key in jiao: jiao[key] = new_long
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for product_id in stock_ids:
            product = data_products[product_id]
            if '5～7個工作天' in str(product.get('fulfillmentNotice','')) or product.get('readyStock') is not True:
              raise SystemExit(f'{product_id}被錯套龜鹿飲交期')
          for product_id in drink_ids:
            product = data_products[product_id]
            if '5～7個工作天' not in str(product.get('fulfillmentNotice','')) or product.get('readyStock') is not False:
              raise SystemExit(f'{product_id}缺少龜鹿飲接單製作交期')

          actual_paths = [Path('data.json'), Path('line-sales-master.json')]
          for rel in ['server.js','product-sales-master.js','line-image-safety-core.js','line-plain-text-safety.js']:
            path = Path(rel)
            if path.exists(): actual_paths.append(path)
          actual = '\n'.join(path.read_text(encoding='utf-8', errors='ignore') for path in actual_paths)
          if old_long in actual or old_short in actual:
            raise SystemExit('LINE OA實際執行資料仍含龜鹿膠舊字序')

          for rel in [
            'diagnostics/line-v424-validation.json','diagnostics/line-v426-validation.json',
            'diagnostics/line-v429-authority.json','diagnostics/line-v430-authority.json'
          ]:
            path = Path(rel)
            if path.exists(): path.unlink()

          Path('.github/workflows/one-time-authority-cleanup.yml').unlink()
          print(f'PASS：LINE OA正式資料清理完成，文字更新 {len(changed)} 個檔案。')
          PY

      - name: 提交清理結果並移除本工作流
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(line): finalize exact six-product authority and remove obsolete data'
          git pull --rebase origin main
          git push origin HEAD:main
