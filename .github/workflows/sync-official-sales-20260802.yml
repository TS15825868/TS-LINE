name: 同步 LINE OA 最新正式售價與驗證

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-official-sales-20260802.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-official-line-sales-20260802
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Patch canonical sales data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const official = {
            'guilu-gao': { price: 2000, originalPrice: null, offers: [], promotionTexts: [], priceText: '$2,000 / 罐', priceLabel: '售價2,000元', originalPriceText: null },
            'guilu-drink-30': { price: 100, originalPrice: null, offers: [], promotionTexts: [], priceText: '$100 / 罐', priceLabel: '售價100元', originalPriceText: null },
            'guilu-drink-180': { price: 200, originalPrice: null, offers: [], promotionTexts: [], priceText: '$200 / 包', priceLabel: '售價200元', originalPriceText: null },
            'guilu-tangkuai': { price: 2000, originalPrice: null, offers: [], promotionTexts: [], priceText: '$2,000 / 盒', priceLabel: '售價2,000元', originalPriceText: null },
            'luerong-fen': { price: 2000, originalPrice: null, offers: [], promotionTexts: [], priceText: '$2,000 / 罐', priceLabel: '售價2,000元', originalPriceText: null },
            'guilu-jiao': { price: 8000, originalPrice: null, offers: [], promotionTexts: [], priceText: '$8,000 / 盒', priceLabel: '售價8,000元', originalPriceText: null }
          };

          function applyProduct(product, patch) {
            if (!product || !patch) return;
            for (const [key, value] of Object.entries(patch)) {
              if (value === null && key === 'originalPriceText') delete product[key];
              else product[key] = value;
            }
          }

          const masterPath = 'line-sales-master.json';
          const master = JSON.parse(fs.readFileSync(masterPath, 'utf8'));
          master.version = '2026-08-02-v8';
          for (const [id, patch] of Object.entries(official)) applyProduct(master.products?.[id], patch);
          fs.writeFileSync(masterPath, JSON.stringify(master, null, 2) + '\n');

          const dataPath = 'data.json';
          const data = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
          for (const product of data.products || []) applyProduct(product, official[product.id]);
          fs.writeFileSync(dataPath, JSON.stringify(data, null, 2) + '\n');

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = '6.1.2';
          pkg.description = '仙加味 LINE OA 正式版｜最新正式售價與產品資料同步｜真實產品原圖｜人工審核後每週兩篇排程｜防止重複發布';
          pkg.scripts.test = pkg.scripts.test.replace(
            /node -e \\"const m=require\('\.\/line-sales-master\.json'\);.*?process\.exit\(1\)\\" && /,
            "node -e \\"const m=require('./line-sales-master.json');if(m.products['guilu-gao'].price!==2000||m.products['guilu-drink-30'].price!==100||m.products['guilu-drink-180'].price!==200||m.products['guilu-tangkuai'].price!==2000||m.products['luerong-fen'].price!==2000||m.products['guilu-jiao'].price!==8000||(m.comboOffers||[]).length!==3||!m.imagePolicy.partners.includes('小鹿娃娃')||!m.imagePolicy.partners.includes('小烏龜娃娃'))process.exit(1)\\" && "
          );
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run complete LINE OA test suite
        run: npm test

      - name: Verify official values after tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const expected = {
            'guilu-gao': 2000,
            'guilu-drink-30': 100,
            'guilu-drink-180': 200,
            'guilu-tangkuai': 2000,
            'luerong-fen': 2000,
            'guilu-jiao': 8000
          };
          for (const file of ['line-sales-master.json', 'data.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            const products = Array.isArray(json.products) ? Object.fromEntries(json.products.map(p => [p.id, p])) : json.products;
            for (const [id, price] of Object.entries(expected)) {
              if (!products[id] || products[id].price !== price) throw new Error(`${file}:${id} expected ${price}, got ${products[id]?.price}`);
            }
          }
          console.log('PASS latest official prices synchronized');
          NODE

      - name: Commit verified canonical data and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-official-sales-20260802.yml
          git config user.name "仙加味正式資料同步"
          git config user.email "actions@users.noreply.github.com"
          git add data.json line-sales-master.json package.json package-lock.json .github/workflows/sync-official-sales-20260802.yml
          git commit -m "fix: synchronize latest official LINE OA prices [skip ci]"
          git pull --rebase origin main
          git push origin main
