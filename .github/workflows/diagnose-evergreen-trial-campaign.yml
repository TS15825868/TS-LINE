name: 診斷並套用LINE OA長期試喝

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/evergreen-trial-diagnostic-trigger.md'
      - '.github/workflows/diagnose-evergreen-trial-campaign.yml'

permissions:
  contents: write

concurrency:
  group: ts-line-evergreen-trial-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply, repair tests and always record result
        id: trial
        shell: bash
        run: |
          set +e
          : > /tmp/trial.log
          node tools/apply-evergreen-trial-campaign.mjs >> /tmp/trial.log 2>&1
          APPLY_STATUS=$?
          REPAIR_STATUS=99
          TEST_STATUS=99
          if [ "$APPLY_STATUS" -eq 0 ]; then
            node tools/repair-evergreen-trial-tests.mjs >> /tmp/trial.log 2>&1
            REPAIR_STATUS=$?
          fi
          if [ "$APPLY_STATUS" -eq 0 ] && [ "$REPAIR_STATUS" -eq 0 ]; then
            node --check server.js >> /tmp/trial.log 2>&1
            SYNTAX_STATUS=$?
            if [ "$SYNTAX_STATUS" -eq 0 ]; then
              npm test >> /tmp/trial.log 2>&1
              TEST_STATUS=$?
            else
              TEST_STATUS=$SYNTAX_STATUS
            fi
          fi
          STATUS="failure"
          if [ "$APPLY_STATUS" -eq 0 ] && [ "$REPAIR_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ]; then STATUS="success"; fi
          node --input-type=module <<NODE
          import { writeFileSync, readFileSync } from 'node:fs';
          const log = readFileSync('/tmp/trial.log','utf8');
          writeFileSync('trial-campaign-diagnostic.json', JSON.stringify({
            status: '${STATUS}',
            applyStatus: Number('${APPLY_STATUS}'),
            repairStatus: Number('${REPAIR_STATUS}'),
            testStatus: Number('${TEST_STATUS}'),
            commit: process.env.GITHUB_SHA,
            checkedAt: new Date().toISOString(),
            logTail: log.slice(-12000)
          }, null, 2) + '\n');
NODE
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          cat /tmp/trial.log
      - name: Commit successful result or failure diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.trial.outputs.status }}" = "success" ]; then
            git add server.js data.json test.js function.test.js catalog.test.js security.test.js README.md trial-campaign-diagnostic.json
            MESSAGE='feat(line): activate evergreen guilu drink trial flow'
          else
            git add trial-campaign-diagnostic.json
            MESSAGE='ci(trial): record LINE OA trial failure diagnostic'
          fi
          if git diff --cached --quiet; then
            echo 'No diagnostic changes.'
          else
            git commit -m "$MESSAGE"
            git push origin HEAD:main
          fi
      - name: Fail after diagnostic is committed
        if: steps.trial.outputs.status != 'success'
        run: exit 1
