name: 仙加味 LINE 目前權威一次性整理

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-line-current-authority-repair.yml'

permissions:
  contents: write

concurrency:
  group: xianjiawei-line-current-authority-repair
  cancel-in-progress: true

jobs:
  repair-line-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Patch old rollback guards and current media checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements={
            'product-sales-master.js':[
              ('[/每日早上及下午各一小匙/g, "一天一次一小匙"],','[/一天一次一小匙/g, "每日早上及下午各一小匙"],'),
              ('[/早晚各一小匙/g, "一天一次一小匙"],','[/早晚各一小匙/g, "每日早上及下午各一小匙"],')
            ],
            'line-plain-text-safety.js':[
              ('const POLICY_VERSION = "2026-08-11-current-authority-line-health";','const POLICY_VERSION = "2026-08-14-current-authority-line-health";'),
              ('guiluGaoUsagePrimary: "一天一次一小匙"','guiluGaoUsagePrimary: "每日早上及下午各一小匙"'),
              ('guiluJiaoSpecification: "600g／盒｜32塊裝"','guiluJiaoSpecification: "600g（1斤）／盒｜32塊裝"')
            ],
            'line-health-authority.test.js':[
              ('assert.equal(payload.guiluGaoUsagePrimary, "一天一次一小匙");','assert.equal(payload.guiluGaoUsagePrimary, "每日早上及下午各一小匙");'),
              ('assert.equal(payload.guiluJiaoSpecification, "600g／盒｜32塊裝");','assert.equal(payload.guiluJiaoSpecification, "600g（1斤）／盒｜32塊裝");'),
              ('"每日早上及下午各一小匙", "每塊約9.375g", "每塊約18.75g", "1斤"','"一天一次一小匙"')
            ],
            'tools/sync_sales_master_current.js':[
              ('/images/customer-display-v20260812/guilu-drink-30cc.webp','/images/customer-display-v20260812/guilu-drink-30cc.avif'),
              ('/images/dm-approved-v20260810/guilu-drink-30cc.webp','/images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg'),
              ('/images/customer-display-v20260812/guilu-drink-180cc.webp','/images/customer-display-v20260812/guilu-drink-180cc-product.jpg'),
              ('/images/customer-display-v20260812/trial-small-boss.webp','/images/trial/trial-poster-small-boss-official-v20260814.jpg'),
              ('if(!policy.includes("產品介紹固定使用六張正式產品圖")||!policy.includes("詳細DM")||!policy.includes("試喝"))throw new Error("LINE媒體角色分離政策未同步");','if(!policy.includes("產品介紹")||!policy.includes("正式產品圖")||!policy.includes("詳細DM")||!policy.includes("試喝"))throw new Error("LINE媒體角色分離政策未同步");')
            ]
          }
          for rel,pairs in replacements.items():
            path=Path(rel)
            text=path.read_text(encoding='utf-8')
            for old,new in pairs:
              if old not in text:
                raise SystemExit(f'{rel} 找不到預期舊字串：{old}')
              text=text.replace(old,new)
            path.write_text(text,encoding='utf-8')
          PY

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Regenerate runtime data from current authority
        run: node tools/sync_sales_master_current.js --write

      - name: Validate current LINE health and source safety
        shell: bash
        run: |
          node --check product-sales-master.js
          node --check line-plain-text-safety.js
          node --check tools/sync_sales_master_current.js
          node line-health-authority.test.js
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data.json','utf8'));
          const gao=data.products.find(p=>p.id==='guilu-gao');
          const p30=data.products.find(p=>p.id==='guilu-drink-30');
          if(gao?.usage?.[0]!=='每日早上及下午各一小匙')throw new Error('龜鹿膏用法仍未同步');
          if(!String(p30?.dmImage||'').includes('/images/dm-final/02_guilu-drink-30cc-dm-official-v20260814.jpg'))throw new Error('30cc DM仍未同步8/14正式JPG');
          if(String(data.trialPosterAuthority?.currentDisplay||'').indexOf('/images/trial/trial-poster-small-boss-official-v20260814.jpg')<0)throw new Error('試喝主圖仍未同步8/14正式海報');
          console.log('PASS: LINE 用法、30cc DM、試喝海報與官網目前正式權威一致。');
          NODE

      - name: Commit repaired LINE runtime sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-sales-master.js line-plain-text-safety.js line-health-authority.test.js tools/sync_sales_master_current.js data.json
          if git diff --cached --quiet; then
            echo 'LINE current authority already aligned.'
            exit 0
          fi
          git commit -m 'sync(line): align runtime guards with current authority'
          git push origin HEAD:main
