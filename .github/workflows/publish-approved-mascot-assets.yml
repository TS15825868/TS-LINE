name: 發布 LINE OA 正式小老闆圖片

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-approved-mascot-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-approved-line-mascot-assets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout TS-LINE main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download approved website artwork and publish LINE JPEGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/mascot /tmp/line-approved
          base="https://raw.githubusercontent.com/TS15825868/xianjiawei/main/images/brand/approved-v405"
          curl -fL --retry 3 "$base/choose.webp" -o /tmp/line-approved/recommend.webp
          curl -fL --retry 3 "$base/combo.webp" -o /tmp/line-approved/combo.webp
          curl -fL --retry 3 "$base/guide-how-to-use.webp" -o /tmp/line-approved/usage.webp
          curl -fL --retry 3 "$base/faq.webp" -o /tmp/line-approved/faq.webp
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          for name in ('recommend', 'combo', 'usage', 'faq'):
              source = Path(f'/tmp/line-approved/{name}.webp')
              target = Path(f'public/mascot/{name}.jpg')
              with Image.open(source) as image:
                  image = ImageOps.exif_transpose(image).convert('RGB')
                  canvas = Image.new('RGB', (1200, 1200), '#f7f4ed')
                  fitted = ImageOps.contain(image, (1200, 1200), Image.Resampling.LANCZOS)
                  x = (1200 - fitted.width) // 2
                  y = (1200 - fitted.height) // 2
                  canvas.paste(fitted, (x, y))
                  canvas.save(target, 'JPEG', quality=90, optimize=True, progressive=True)
              with Image.open(target) as checked:
                  checked.verify()
              with Image.open(target) as checked:
                  if checked.size != (1200, 1200) or checked.format != 'JPEG':
                      raise SystemExit(f'{target}: invalid result {checked.size} {checked.format}')
                  print(target, checked.size, checked.format, target.stat().st_size)
          PY

      - name: Commit approved LINE OA images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "仙加味正式素材發布"
          git config user.email "actions@users.noreply.github.com"
          git add public/mascot/recommend.jpg public/mascot/combo.jpg public/mascot/usage.jpg public/mascot/faq.jpg
          if git diff --cached --quiet; then
            echo "All approved LINE OA images are already current"
            exit 0
          fi
          git commit -m "feat: publish approved LINE OA Issue 146 images [skip ci]"
          git pull --rebase origin main
          git push origin main
