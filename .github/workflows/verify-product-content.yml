name: 驗證產品與品牌社群排程

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "line-sales-master.json"
      - "brand-content.json"
      - "brand-content-runtime.js"
      - "social-product-content-rebuild.js"
      - "social-product-content-bootstrap.js"
      - "social-product-content-rebuild.test.js"
      - "social-final-posts.js"
      - "social-final-approved-batch.js"
      - "social-review-only-mode.js"
      - "social-schedule-repair-20260722.js"
      - ".github/workflows/verify-product-content.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-product-brand-review-verification
  cancel-in-progress: true

jobs:
  verify-product-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify current product, brand and legacy cleanup contracts
        run: |
          set -euo pipefail
          npm ci
          npm test
          node social-product-content-rebuild.test.js
          node - <<'NODE'
          const sales = require('./line-sales-master.json');
          const brand = require('./brand-content.json');
          if (sales.version !== '2026-08-02-v11') throw new Error('正式售價版本錯誤');
          if (sales.products?.['guilu-gao']?.price !== 1500 || sales.products?.['guilu-gao']?.originalPrice !== 1800) throw new Error('龜鹿膏售價錯誤');
          const drink30 = sales.products?.['guilu-drink-30'];
          if (drink30?.name !== '龜鹿飲30cc玻璃瓶' || drink30?.specification !== '30cc／瓶（小玻璃瓶）' || drink30?.unit !== '瓶') throw new Error('龜鹿飲30cc正式名稱或規格錯誤');
          if (drink30?.price !== 50 || !drink30?.offers?.includes('買10送2')) throw new Error('龜鹿飲30cc售價或活動錯誤');
          if (sales.products?.['guilu-drink-180']?.price !== 200 || !sales.products?.['guilu-drink-180']?.offers?.includes('買10送2')) throw new Error('龜鹿飲180cc售價或活動錯誤');
          if (sales.products?.['guilu-tangkuai']?.price !== 1600) throw new Error('龜鹿湯塊售價錯誤');
          if (sales.products?.['luerong-fen']?.price !== 2000) throw new Error('鹿茸粉售價錯誤');
          if (sales.products?.['guilu-jiao']?.price !== 9600 || sales.products?.['guilu-jiao']?.originalPrice !== 12000 || sales.products?.['guilu-jiao']?.quoteOnly !== false) throw new Error('龜鹿膠售價錯誤');
          for (const label of ['品牌故事','品牌由來','選料理念','品質把關','傳統工法','品牌承諾']) {
            if (!brand.quickReplies?.[label]) throw new Error(`品牌內容缺少：${label}`);
          }
          NODE

      - name: Wait for Render and verify current ten-post review-only campaign
        shell: bash
        env:
          BASE_URL: https://ts-line.onrender.com
        run: |
          set -euo pipefail
          mkdir -p /tmp/xjw-product-brand
          success=0
          for attempt in $(seq 1 96); do
            echo "Product and brand review verification $attempt/96"
            release_code=$(curl --connect-timeout 10 --max-time 65 --silent --show-error -o /tmp/xjw-product-brand/release.json -w "%{http_code}" "$BASE_URL/social/final-release-healthz?t=$(date +%s)" || true)
            review_code=$(curl --connect-timeout 10 --max-time 45 --silent --show-error -o /tmp/xjw-product-brand/review.json -w "%{http_code}" "$BASE_URL/social/review-gate-status?t=$(date +%s)" || true)
            schedule_code=$(curl --connect-timeout 10 --max-time 45 --silent --show-error -o /tmp/xjw-product-brand/schedule.json -w "%{http_code}" "$BASE_URL/social/schedule-status?t=$(date +%s)" || true)

            if [ "$release_code" = "200" ] && [ "$review_code" = "200" ] && { [ "$schedule_code" = "200" ] || [ "$schedule_code" = "409" ]; }; then
              if node - <<'NODE'
          const release = require('/tmp/xjw-product-brand/release.json');
          const review = require('/tmp/xjw-product-brand/review.json');
          const schedule = require('/tmp/xjw-product-brand/schedule.json');
          if (release.ok !== true || Number(release.totalPosts) !== 10 || Number(release.fixedPosts) !== 7 || Number(release.weatherStandbyPosts) !== 3) throw new Error('十篇正式內容未部署');
          if (!Array.isArray(release.assets) || release.assets.length !== 10 || release.assets.some((asset) => asset.ok !== true || Number(asset.width) !== 1254 || Number(asset.height) !== 1254)) throw new Error('正式圖片未完整部署');
          if (review.ok !== true || review.version !== '2026-07-26-review-gate-v5' || review.reviewRequiredBeforePublish !== true || review.automaticRetryEnabled !== false || Number(review.canonicalCount) !== 10 || Number(review.unreviewedActiveCount) !== 0) throw new Error('待審安全狀態錯誤');
          if (schedule.version !== '2026-07-25-v6' || Number(schedule.canonicalCount) !== 10 || schedule.rule?.fixed !== '每週1篇，週三 20:00' || !String(schedule.rule?.weatherException || '').includes('週末不發布')) throw new Error('正式排程錯誤');
          if (Array.isArray(schedule.issues) && schedule.issues.length) throw new Error(schedule.issues.join('｜'));
          NODE
              then success=1; break; fi
            fi
            sleep 15
          done

          if [ "$success" -ne 1 ]; then
            echo '產品與品牌社群正式狀態未通過' >&2
            for file in release review schedule; do
              echo "--- $file ---" >&2
              cat "/tmp/xjw-product-brand/$file.json" 2>/dev/null || true
            done
            exit 1
          fi

          echo '產品與品牌內容已統一為十篇待審、核准後每週三20:00排程，天氣內容僅條件加發。'
