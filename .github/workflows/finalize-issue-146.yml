name: 完成 LINE OA Issue 146

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-issue-146.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch LINE OA approved scene routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('const MASCOT_VERSION = "401.6-20260714";', 'const MASCOT_VERSION = "401.7-20260801-issue146";')
          text = text.replace('  recommend: mascotAssetUrl("recommend"),\n  usage:', '  recommend: mascotAssetUrl("recommend"),\n  combo: mascotAssetUrl("combo"),\n  usage:')
          text = text.replace('  if (/使用|沖泡|燉湯|料理/.test(title)) return "usage";', '  if (/搭配|組合/.test(title)) return "combo";\n  if (/使用|沖泡|燉湯|料理/.test(title)) return "usage";')
          text = text.replace('        flexCard(\n          "日常搭配導覽",', '        mascotBubble(\n          "日常搭配導覽",')
          path.write_text(text, encoding='utf-8')
          PY
          node --check server.js
          node --check line-image-safety.js
          node function.test.js
      - name: Commit finalized Issue 146 routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "仙加味自動修正"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "Issue 146 routing already finalized"
            exit 0
          fi
          git commit -m "fix: finalize LINE OA Issue 146 scene routing [skip ci]"
          git pull --rebase origin main
          git push origin main
