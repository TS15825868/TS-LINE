name: 仙加味 LINE OA 目前正式版完整驗收

# 核心 LINE OA 權威／runtime／顧客資料變更時自動驗收；其他一般素材或文件更新不浪費 Actions。
# 正式規格只由 repo 目前權威與正式測試判斷，不在 workflow 複製第二套舊資料。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'assets/data/official-products.json'
      - 'data.json'
      - 'tools/sync_sales_master_current.js'
      - 'product-sales-master.js'
      - 'line-app-bootstrap.js'
      - 'brand-content-runtime.js'
      - 'server.js'
      - 'approved-post-library.js'
      - 'approved-post-static.js'
      - 'line-public-copy-authority.test.js'
      - 'line-production-readiness.test.js'
      - 'line-products-v3-authority.test.js'
      - 'line-formal-media-route.test.js'
      - 'line-rich-menu-sync.js'
      - 'line-rich-menu-sync.test.js'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: xianjiawei-lineoa-current-release-audit
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run current LINE OA release checks
        run: |
          npm test
          npm run check:catalog
          npm run guard:full
          npm run security:audit

      - name: Verify current visibility and service boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const pkg=require('./package.json');
          const current=require('./assets/data/official-products.json');
          const data=require('./data.json');
          const qixuanId='qixuan-guilu-drink-powder';
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};

          must(pkg.main==='server.js','LINE正式入口必須是 server.js');
          must(pkg.scripts.start==='node -r ./product-sales-master.js -r ./line-app-bootstrap.js -r ./brand-content-runtime.js server.js','LINE正式 start 不同步');
          must(pkg.scripts.prestart==='node tools/sync_sales_master_current.js --write','prestart 只應同步目前正式權威，避免正式冷啟動重跑完整測試');
          must(pkg.scripts['guard:full'].includes('line-public-copy-authority.test.js'),'guard:full 必須包含公開資料防回流守門');
          must(pkg.scripts['guard:full'].includes('line-production-readiness.test.js'),'guard:full 必須包含正式 readiness');

          must(current.authority==='user-confirmed-current','目前產品權威錯誤');
          must(Array.isArray(current.knowledgeProductIds)&&current.knowledgeProductIds.length===6,'LINE目前可見產品知識必須六項');
          must(!current.knowledgeProductIds.includes(qixuanId),'柒玄茶目前不得出現在LINE可見知識');
          must(Array.isArray(current.temporarilyHiddenProductIds)&&current.temporarilyHiddenProductIds.includes(qixuanId),'柒玄茶必須保留為暫時隱藏資料');
          const qixuan=(current.products||[]).find(p=>p.id===qixuanId);
          must(qixuan&&qixuan.temporarilyHidden===true&&qixuan.lineKnowledgeVisible===false,'柒玄茶隱藏旗標不同步');
          must(Array.isArray(data.products)&&data.products.length===6,'LINE顧客產品卡必須六項');

          for(const forbidden of ['internal-entry.js','social-review-center','social-publish-guard','instagram-content-publishing','facebook-page-token','internal-app-pro']){
            must(!pkg.scripts.start.includes(forbidden),`LINE正式 start 仍載入非必要模組：${forbidden}`);
          }

          const workflows=fs.readdirSync('.github/workflows');
          must(!workflows.includes('sync-social-content-v20260817.yml'),'退役社群同步 workflow 不得回流 TS-LINE');
          console.log('PASS: LINE OA six visible products, Qixuan hidden, guards stay in CI, runtime cold start stays lean.');
          NODE

      - name: Ensure audit is read-only
        run: |
          git checkout -- data.json assets/data/official-products.json
          git diff --exit-code
