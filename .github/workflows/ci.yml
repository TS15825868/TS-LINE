name: 仙加味 LINE OA 正式版手動驗收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-lineoa-manual-audit
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run LINE OA release tests
        run: npm test

      - name: Verify formal catalog remains synchronized
        run: npm run check:catalog

      - name: Verify standalone LINE OA production contract
        shell: bash
        run: |
          set -euo pipefail
          test -f line-sales-master.json
          test -f product-sales-master.js
          test -f line-product-photo-authority.json
          test -f line-image-safety.js
          test -f line-plain-text-safety.js
          test -f line-recording-ui-fix.js
          test -f line-rich-menu-sync.js
          test -f assets/rich-menu/xianjiawei-rich-menu-v11.svg
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const sales = require('./line-sales-master.json');
          const data = require('./data.json');
          const rich = require('./line-rich-menu-sync');
          const plain = require('./line-plain-text-safety');
          const core = require('./line-image-safety-core');

          if (lock.lockfileVersion !== 3) throw new Error('package-lock格式錯誤');
          if (JSON.stringify(lock.packages?.['']?.dependencies || {}) !== JSON.stringify(pkg.dependencies || {})) throw new Error('package與package-lock依賴不同步');
          if (pkg.main !== 'server.js') throw new Error('LINE正式入口不是server.js');
          if (pkg.scripts.start !== 'node -r ./product-sales-master.js server.js') throw new Error('LINE正式start仍混入社群/ERP模組');
          for (const forbidden of ['internal-entry.js','social-review-center','social-publish-guard','instagram-content-publishing','facebook-page-token','internal-app-pro']) {
            if (pkg.scripts.start.includes(forbidden)) throw new Error(`LINE正式start仍載入非必要模組：${forbidden}`);
          }

          const byId = Object.fromEntries((data.products || []).map(p => [p.id,p]));
          if (data.products?.length !== 6) throw new Error('data.json正式產品不是六項');
          const expected = {
            'guilu-gao':['100g／罐',1800],
            'guilu-drink-30':['30cc／罐（小玻璃罐）',60],
            'guilu-drink-180':['180cc／包（鋁袋）',200],
            'guilu-tangkuai':['75g／盒｜8塊裝｜每塊約9.375g',1600],
            'guilu-jiao':['600g（1斤）／盒｜32塊裝｜每塊約18.75g',9600],
            'luerong-fen':['75g／罐',2000],
          };
          for (const [id,[spec,price]] of Object.entries(expected)) {
            const p=byId[id];
            if (!p || (p.specification||p.size||p.spec)!==spec || Number(p.price)!==price) throw new Error(`${id}正式規格/售價不同步`);
            for (const field of ['image','imageUrl','image_url','dmImage','officialOriginalImage']) {
              if (!String(p[field]||'').includes('/images/products-v3/')) throw new Error(`${id}.${field}不是products-v3`);
            }
            if (!String(p.physicalScalePolicy||'').trim()) throw new Error(`${id}缺少個別尺寸/比例規則`);
          }
          if (!/Ø42.*H51|小玻璃裸罐/i.test(byId['guilu-drink-30'].physicalScalePolicy)) throw new Error('30cc尺寸鎖錯誤');
          if (!/0\.60.*0\.68|狹長直立鋁袋/i.test(byId['guilu-drink-180'].physicalScalePolicy)) throw new Error('180cc比例鎖錯誤');
          if ((byId['guilu-drink-30'].offers||[]).find(o=>o.label==='買10送1')?.total !== 600) throw new Error('30cc買10送1錯誤');
          if ((byId['guilu-drink-180'].offers||[]).find(o=>o.label==='買10送1')?.total !== 2000) throw new Error('180cc買10送1錯誤');
          if (data.trialCampaign?.contents !== '30cc小玻璃罐×3罐' || data.trialCampaign?.productFee !== 0) throw new Error('試喝內容錯誤');
          if (JSON.stringify((data.trialCampaign?.shippingOptions||[]).map(o=>[o.id,o.fee])) !== JSON.stringify([['store',60],['home',100]])) throw new Error('試喝運費錯誤');

          const menu=rich.menuDefinition();
          if (rich.VERSION !== '20260809-rich-menu-native-single-artwork-v11' || menu.areas.length !== 6) throw new Error('Rich Menu正式版本/熱區錯誤');
          if (menu.areas.some(a=>a.bounds.y<176)) throw new Error('Rich Menu品牌Header誤成熱區');
          const health=plain.healthPayload(core);
          if (health.serviceMode !== 'standalone-line-oa' || health.productMainImageSource !== 'products-v3-user-approved-originals') throw new Error('LINE健康權威錯誤');
          if (JSON.stringify(health).includes('products-v2-actual-photos')) throw new Error('LINE健康診斷仍回報舊products-v2');

          const all = JSON.stringify({sales, data});
          for (const legacy of ['買10送2','共12罐500元','共12包2,000元','30cc／瓶（小玻璃瓶）','買10送1，共11罐500元']) {
            if (all.includes(legacy)) throw new Error(`正式執行資料仍含舊資料：${legacy}`);
          }
          console.log(`PASS TS-LINE ${pkg.version}: standalone LINE OA, six canonical products, products-v3, native Rich Menu and source-native fulfillment/trial rules`);
          NODE

      - name: Restore generated mirror and ensure audit is read-only
        run: |
          git checkout -- data.json
          git diff --exit-code
