name: TS-LINE 正式版自動驗收

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-line-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete LINE OA, social, review and schedule tests
        run: npm test

      - name: Verify public catalog remains synchronized
        run: npm run check:catalog

      - name: Verify main-only production files
        shell: bash
        run: |
          set -euo pipefail
          test -f line-sales-master.json
          test -f product-sales-master.js
          test -f social-weekly-schedule-override.js
          test -f social-review-only-mode.js
          test -f social-final-posts.js
          test -f social-final-approved-batch.js
          test -f social-schedule-policy.js
          test -f social-schedule-repair-20260722.js
          test -f social-publish-guard.js
          test -f MASCOT_CHARACTER_SPEC.md
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const sales = require('./line-sales-master.json');
          if (pkg.version !== '6.1.1') throw new Error('package version must be 6.1.1');
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) throw new Error('package lock version mismatch');
          if (sales.version !== '2026-08-02-v11') throw new Error('正式售價主檔版本錯誤');
          if (sales.products?.['guilu-gao']?.price !== 1500 || sales.products?.['guilu-gao']?.originalPrice !== 1800) throw new Error('龜鹿膏售價與優惠價主檔錯誤');
          const drink30 = sales.products?.['guilu-drink-30'];
          if (drink30?.name !== '龜鹿飲30cc玻璃瓶' || drink30?.specification !== '30cc／瓶（小玻璃瓶）' || drink30?.unit !== '瓶') throw new Error('龜鹿飲30cc正式名稱或規格錯誤');
          if (drink30?.price !== 50 || !drink30?.offers?.includes('買10送2')) throw new Error('龜鹿飲30cc售價或活動主檔錯誤');
          if (sales.products?.['guilu-drink-180']?.price !== 200 || !sales.products?.['guilu-drink-180']?.offers?.includes('買10送2')) throw new Error('龜鹿飲180cc售價或活動主檔錯誤');
          if (sales.products?.['guilu-tangkuai']?.price !== 1600) throw new Error('龜鹿湯塊售價主檔錯誤');
          if (sales.products?.['luerong-fen']?.price !== 2000) throw new Error('鹿茸粉售價主檔錯誤');
          if (sales.products?.['guilu-jiao']?.price !== 9600 || sales.products?.['guilu-jiao']?.originalPrice !== 12000 || sales.products?.['guilu-jiao']?.quoteOnly !== false) throw new Error('龜鹿膠售價與優惠價主檔錯誤');
          if (!sales.imagePolicy?.partners?.includes('小鹿娃娃') || !sales.imagePolicy?.partners?.includes('小烏龜娃娃')) throw new Error('小老闆固定夥伴缺漏');
          if (sales.imagePolicy?.approvalRequiredBeforePublish !== true) throw new Error('人工審核規則未鎖定');
          console.log('TS-LINE v6.1.1 main-only validation passed');
          NODE
