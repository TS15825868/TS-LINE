name: LINE OA長期試喝與買10送1正式化

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/finalize-evergreen-trial-v412.trigger'

permissions:
  contents: write

concurrency:
  group: line-evergreen-trial-v412
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 套用正式 LINE OA 政策
        shell: bash
        run: |
          set -euo pipefail
          node tools/apply-evergreen-trial-campaign.mjs
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
      - name: 驗證底層資料與執行時資料一致
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check product-sales-master.js
          node --check tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node --input-type=module <<'NODE'
          import { readFileSync,writeFileSync,mkdirSync } from 'node:fs';
          const data=JSON.parse(readFileSync('data.json','utf8'));
          const master=JSON.parse(readFileSync('line-sales-master.json','utf8'));
          const d30=data.products.find(x=>x.id==='guilu-drink-30');
          const d180=data.products.find(x=>x.id==='guilu-drink-180');
          if(d30.name!=='龜鹿飲30cc玻璃罐'||d30.unit!=='罐'||d30.size!=='30cc／罐（小玻璃罐）') throw new Error('30cc名稱或規格錯誤');
          if(!String(d30.description||'').includes('裸罐')) d30.description='30cc小玻璃罐，維持原有尺寸、裸罐、無貼紙，適合第一次接觸、外出攜帶與工作空檔安排。';
          if(d30.offers?.[0]?.qty!==11||d30.offers?.[0]?.total!==500||d30.offers?.[0]?.label!=='買10送1') throw new Error('30cc買10送1錯誤');
          if(d180.offers?.[0]?.qty!==11||d180.offers?.[0]?.total!==2000||d180.offers?.[0]?.label!=='買10送1') throw new Error('180cc買10送1錯誤');
          const gao=data.products.find(x=>x.id==='guilu-gao');
          if(gao.price!==1800||gao.originalPrice!==2100) throw new Error('龜鹿膏價格錯誤');
          if(data.trialCampaign?.contents!=='30cc小玻璃罐×3罐'||data.trialCampaign?.productFee!==0) throw new Error('試喝內容錯誤');
          if(!String(data.trialCampaign?.fulfillmentRule||'').includes('5～7個工作天')) throw new Error('出貨時間錯誤');
          if(master.products?.['guilu-drink-30']?.offers?.[0]!=='買10送1') throw new Error('LINE銷售母本30cc活動錯誤');
          const all=[readFileSync('server.js','utf8'),JSON.stringify(data),JSON.stringify(master)].join('\n');
          for(const old of ['買10送2','共12罐500元','共12包2,000元','30cc玻璃瓶','30cc／瓶（小玻璃瓶）']) if(all.includes(old)) throw new Error(`仍有舊資料：${old}`);
          writeFileSync('data.json',JSON.stringify(data,null,2)+'\n');
          mkdirSync('diagnostics',{recursive:true});
          writeFileSync('diagnostics/line-evergreen-trial-v412.json',JSON.stringify({checked_at:new Date().toISOString(),drink30:'50元／罐，買10送1，共11罐500元',drink180:'200元／包，買10送1，共11包2,000元',trial:'30cc小玻璃罐3罐免費，運費自付',lead_time:'5～7個工作天',conversion_channel:'LINE OA',legacy_records:0},null,2)+'\n');
          NODE
      - name: 提交正式 LINE OA 資料
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json line-sales-master.json server.js package.json product-sales-master.js diagnostics/line-evergreen-trial-v412.json tools/finalize-evergreen-trial-buy10get1-v412.mjs
          if git diff --cached --quiet; then
            echo 'No LINE changes.'
          else
            git commit -m 'feat(line): synchronize final evergreen trial and buy ten get one data v412'
            git push origin HEAD:main
          fi
