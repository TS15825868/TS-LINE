name: LINE OA Closeout Audit Once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/closeout-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install current dependencies
        run: npm install
      - name: Full semantic audit while blocking guards stay paused
        run: npm run guard:full
      - name: Security audit
        run: npm run security:audit
      - name: Syntax safety
        shell: bash
        run: |
          set -euo pipefail
          node --check product-sales-master.js
          node --check line-app-bootstrap.js
          node --check line-image-safety.js
          node --check server.js
      - name: Remove one-time audit workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/closeout-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'audit: confirm current LINE OA release'
          git push
