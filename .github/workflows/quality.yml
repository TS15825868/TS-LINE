name: 仙加味 LINE OA 品質守門員

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-line-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: LINE OA 程式、資料與發布安全檢查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate GitHub Actions rules
        run: node tools/validate_github_workflows.js

      - name: Validate current production entry points
        run: |
          set -euo pipefail
          node --check internal-entry.js
          node --check server.js
          node --check social-server.js
          node --check product-sales-master.js
          node --check product-quote-only-guard.js
          node --check social-publish-guard.js
          node --check social-review-only-mode.js
          node --check social-weekly-schedule-override.js
          node --check runtime-social-stabilizer.js
          node product-quote-only-guard.test.js
          node social-publish-guard.test.js
          node -r ./social-weekly-schedule-override.js social-current-policy.test.js
          node -r ./social-weekly-schedule-override.js social-review-only-mode.test.js
          node runtime-social-stabilizer.test.js

      - name: Verify official LINE OA catalog policy
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const master = JSON.parse(fs.readFileSync('line-sales-master.json', 'utf8'));
          const required = ['guilu-gao','guilu-drink-30','guilu-drink-180','guilu-tangkuai','guilu-jiao','luerong-fen'];
          for (const id of required) {
            if (!master.products?.[id]) throw new Error(`缺少正式產品：${id}`);
          }
          const drink30 = master.products['guilu-drink-30'];
          if (drink30.name !== '龜鹿飲30cc玻璃罐') throw new Error('30cc產品名稱錯誤');
          if (drink30.specification !== '30cc／罐（小玻璃罐）' || drink30.unit !== '罐') throw new Error('30cc產品規格錯誤');
          const tangkuai = master.products['guilu-tangkuai'];
          if (tangkuai.specification !== '75g／盒｜8塊裝｜每塊約9.375g') throw new Error('龜鹿湯塊正式規格錯誤');
          if (master.imagePolicy?.realProductImagesOnly !== true || master.imagePolicy?.noProductRedraw !== true || master.imagePolicy?.noPackageTextChange !== true) {
            throw new Error('產品原圖鎖定規則未啟用');
          }
          console.log('PASS：LINE OA 正式產品、規格與產品原圖規則正確。');
          NODE

      - name: Verify final 15 post review package
        run: node tools/validate_final_post_review_package.js

      - name: Verify final post archive manifest
        run: node tools/validate_final_post_archive_manifest.js

      - name: Verify manual approval remains locked
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'assets/data/post-approval-registry-2026-07-30.json';
          if (!fs.existsSync(path)) throw new Error(`缺少人工審核登錄檔：${path}`);
          const registry = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rows = [
            ...(Array.isArray(registry.product_posts) ? registry.product_posts : []),
            ...(Array.isArray(registry.lifestyle_posts) ? registry.lifestyle_posts : []),
          ];
          if (registry.manual_approval_required !== true) throw new Error('人工審核閘門未啟用');
          if (registry.auto_publish !== false || registry.publishable_now !== false) throw new Error('未核准貼文不得自動發布');
          if (rows.length !== 15) throw new Error(`審核貼文數量應為15篇，目前${rows.length}篇`);
          for (const row of rows) {
            if (row.status !== 'pending_owner_approval') throw new Error(`貼文審核狀態異常：${row.id || 'unknown'}`);
          }
          console.log(`PASS：${rows.length} 篇貼文維持人工審核與禁止自動發布。`);
          NODE