name: LINE OA 正式規則與同步最終修正 v416

on:
  push:
    branches: [main]
    paths:
      - staging/line-v416-official-finalize/READY
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: line-v416-official-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply user-confirmed official rules
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const officialFulfillment = '資料及運費確認後採接單安排製作，約5～7個工作天出貨；不含例假日及物流配送時間';
          const officialOrderFulfillment = '訂單資料與付款方式確認完成後，採接單安排製作，約5～7個工作天出貨，不含例假日及物流配送時間。';
          const allowed = new Set(['.js','.mjs','.json','.md','.txt']);
          const skip = new Set(['.git','node_modules','staging']);
          function walk(dir) {
            const out = [];
            for (const name of fs.readdirSync(dir)) {
              if (skip.has(name)) continue;
              const file = path.join(dir,name);
              const stat = fs.statSync(file);
              if (stat.isDirectory()) out.push(...walk(file));
              else if (allowed.has(path.extname(file))) out.push(file);
            }
            return out;
          }
          for (const file of walk('.')) {
            if (file.includes('.github/workflows/line-v416-official-finalize.yml')) continue;
            let text;
            try { text = fs.readFileSync(file,'utf8'); } catch { continue; }
            let next = text
              .split('資料及運費確認後安排製作加工，製作加工約需5～7個工作天；完成後才安排出貨，另加物流配送時間').join(officialFulfillment)
              .split('資料與運費確認後安排製作加工，製作加工約需5～7個工作天；完成後才安排出貨，另加物流配送時間').join(officialFulfillment)
              .split('正式訂單資料與付款方式確認後安排製作加工，製作加工約需5～7個工作天；完成後才安排出貨，另加物流配送時間').join(officialOrderFulfillment.replace(/。$/,''))
              .split('訂單資料與付款方式確認後安排製作加工，製作加工約需5～7個工作天；完成後才安排出貨，另加物流配送時間').join(officialOrderFulfillment.replace(/。$/,''))
              .split('製作加工約需5～7個工作天；完成後才安排出貨，另加物流配送時間').join('約5～7個工作天出貨；不含例假日及物流配送時間')
              .split('製作加工約5～7工作天，完成後出貨').join('約5～7個工作天出貨')
              .split('5～7個工作天僅指製作加工，不含出貨後物流配送時間').join('約5～7個工作天出貨，不含例假日及物流配送時間')
              .split('5～7個工作天僅指製作加工，不含完成後的物流配送時間').join('約5～7個工作天出貨，不含例假日及物流配送時間');
            if (next !== text) fs.writeFileSync(file,next);
          }

          const syncPath = 'tools/sync_website_catalog.js';
          let sync = fs.readFileSync(syncPath,'utf8');
          sync = sync.replace(
`  const ids = (catalog.products || []).map((product) => product.id);
  if (JSON.stringify(ids) !== JSON.stringify(EXPECTED_IDS)) {
    throw new Error(\`共用目錄產品順序或品項不一致：\${ids.join(", ")}\`);
  }`,
`  const ids = (catalog.products || []).map((product) => product.id);
  const uniqueIds = new Set(ids);
  if (uniqueIds.size !== ids.length || JSON.stringify([...uniqueIds].sort()) !== JSON.stringify([...EXPECTED_IDS].sort())) {
    throw new Error(\`共用目錄正式品項不一致：\${ids.join(", ")}\`);
  }`);
          if (!sync.includes('const uniqueIds = new Set(ids)')) throw new Error('共用目錄品項驗證未修正');
          if (!sync.includes('已重試3次')) {
            sync = sync.replace(
`async function fetchCatalog() {
  const url = process.env.CATALOG_URL || DEFAULT_CATALOG_URL;
  const response = await fetch(url, { headers: { "user-agent": "xianjiawei-lineoa-catalog-sync" } });
  if (!response.ok) throw new Error(\`無法下載共用目錄：HTTP \${response.status}\`);
  return response.json();
}`,
`async function fetchCatalog() {
  const url = process.env.CATALOG_URL || DEFAULT_CATALOG_URL;
  let lastError;
  for (let attempt = 1; attempt <= 3; attempt += 1) {
    try {
      const response = await fetch(url, { headers: { "user-agent": "xianjiawei-lineoa-catalog-sync" } });
      if (!response.ok) throw new Error(\`HTTP \${response.status}\`);
      return await response.json();
    } catch (error) {
      lastError = error;
      if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
    }
  }
  throw new Error(\`無法下載共用目錄（已重試3次）：\${lastError?.message || lastError}\`);
}`);
          }
          fs.writeFileSync(syncPath,sync);

          const salesPath = 'tools/sync_sales_master.js';
          let sales = fs.readFileSync(salesPath,'utf8');
          sales = sales
            .replaceAll('hasBuyTenGetTwo','hasBuyTenGetOne')
            .replaceAll('buyTenGetTwo','buyTenGetOne')
            .replace('Number(offer.qty) === 12','Number(offer.qty) === 11')
            .replace('String(offer.label) === "買10送2"','String(offer.label) === "買10送1"')
            .replace('"guilu-gao": { price: 1500, originalPrice: 1800 }','"guilu-gao": { price: 1800, originalPrice: 2100 }')
            .replace('買10送2沒有轉成可正確計價的12入方案','買10送1沒有轉成可正確計價的11入方案');
          if (sales.includes('買10送2') || sales.includes('buyTenGetTwo') || sales.includes('price: 1500, originalPrice: 1800')) throw new Error('售價同步器仍含舊規則');
          fs.writeFileSync(salesPath,sales);

          const catalogTestPath = 'catalog.test.js';
          let catalogTest = fs.readFileSync(catalogTestPath,'utf8');
          catalogTest = catalogTest
            .replace(/assert\.strictEqual\(data\.catalogVersion, "[^"]+"\);/, "assert.match(String(data.catalogVersion || ''), /^\\d+\\.\\d+$/, 'catalogVersion must be a numeric release version');")
            .replace('assert.deepStrictEqual(data.products.map((product) => product.id), expectedIds);', "assert.deepStrictEqual([...data.products.map((product) => product.id)].sort(), [...expectedIds].sort());\nassert.strictEqual(new Set(data.products.map((product) => product.id)).size, expectedIds.length);");
          fs.writeFileSync(catalogTestPath,catalogTest);

          const finalizerPath = 'tools/finalize-evergreen-trial-buy10get1-v412.mjs';
          let finalizer = fs.readFileSync(finalizerPath,'utf8');
          finalizer = finalizer.replace(/fulfillmentRule:\s*'[^']*'/, `fulfillmentRule: '${officialFulfillment}'`);
          finalizer = finalizer.replace(/pkg\.description = '[^']*';/, "pkg.description = '仙加味 LINE OA 正式版｜FB、IG與官網統一導入長期試喝與下單｜30cc三罐試喝品免費、運費自付｜30cc與180cc買10送1｜接單後約5～7個工作天出貨｜人工審核後發布';");
          fs.writeFileSync(finalizerPath,finalizer);

          const applyPath = 'tools/apply-evergreen-trial-campaign.mjs';
          if (fs.existsSync(applyPath)) {
            let apply = fs.readFileSync(applyPath,'utf8');
            apply = apply.replace(/fulfillmentRule:\s*'[^']*'/g, `fulfillmentRule: '${officialFulfillment}'`);
            fs.writeFileSync(applyPath,apply);
          }

          for (const jsonPath of ['data.json','line-sales-master.json']) {
            const data = JSON.parse(fs.readFileSync(jsonPath,'utf8'));
            data.trialCampaign = {...(data.trialCampaign || {}), fulfillmentRule: officialFulfillment};
            if (jsonPath === 'data.json') {
              data.shippingNotes = {
                ...(data.shippingNotes || {}),
                宅配: `${officialOrderFulfillment} 試喝組郵局宅配運費100元。`,
                '7-11賣貨便': `${officialOrderFulfillment} 試喝組7-11店到店運費60元。`,
              };
            }
            fs.writeFileSync(jsonPath,JSON.stringify(data,null,2)+'\n');
          }

          if (fs.existsSync('package.json')) {
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            for (const key of Object.keys(pkg.scripts || {})) {
              pkg.scripts[key] = String(pkg.scripts[key]).replace(/\s*&&\s*node tools\/finalize-trial-production-lead-time-v415\.mjs/g,'');
            }
            pkg.description = '仙加味 LINE OA 正式版｜30cc三罐試喝品免費、運費自付｜30cc與180cc買10送1｜接單後約5～7個工作天出貨｜人工審核後發布';
            fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          }

          for (const obsolete of [
            'tools/finalize-trial-production-lead-time-v415.mjs',
            '.github/workflows/finalize-trial-production-lead-time-v415.yml',
          ]) {
            if (fs.existsSync(obsolete)) fs.rmSync(obsolete,{force:true});
          }
          console.log('PASS：LINE OA 已恢復本次確認的5～7個工作天出貨文字，並修正官網同步器。');
          NODE

      - name: Install, synchronize and validate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run sync:catalog
          npm test
          node test.js
          node catalog.test.js
          node function.test.js
          node line-order-cart.test.js
          node internal-inventory-seed.test.js
          node internal-order-pricing.test.js
          node internal-line-order-sync.test.js

      - name: Reapply official final state and verify
        shell: bash
        run: |
          set -euo pipefail
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node - <<'NODE'
          const fs = require('fs');
          const official = '資料及運費確認後採接單安排製作，約5～7個工作天出貨；不含例假日及物流配送時間';
          for (const file of ['data.json','line-sales-master.json']) {
            const d = JSON.parse(fs.readFileSync(file,'utf8'));
            if (d.trialCampaign?.fulfillmentRule !== official) throw new Error(`${file} 出貨規則不一致`);
          }
          const d = JSON.parse(fs.readFileSync('data.json','utf8'));
          const p30 = d.products.find((p) => p.id === 'guilu-drink-30');
          const p180 = d.products.find((p) => p.id === 'guilu-drink-180');
          if (p30?.name !== '龜鹿飲30cc玻璃罐' || p30?.size !== '30cc／罐（小玻璃罐）' || p30?.offers?.[0]?.qty !== 11 || p30?.offers?.[0]?.total !== 500) throw new Error('30cc正式規格或活動錯誤');
          if (p180?.offers?.[0]?.qty !== 11 || p180?.offers?.[0]?.total !== 2000) throw new Error('180cc正式活動錯誤');
          const text = JSON.stringify(d);
          for (const bad of ['買10送2','共12罐500元','共12包2,000元','30cc／瓶（小玻璃瓶）','製作加工約需5～7個工作天']) if (text.includes(bad)) throw new Error(`仍含舊內容：${bad}`);
          fs.mkdirSync('diagnostics',{recursive:true});
          fs.writeFileSync('diagnostics/line-v416-final.json',JSON.stringify({status:'success',checked_at:new Date().toISOString(),catalog_version:d.catalogVersion,trial:d.trialCampaign,drink30:'50元／罐，買10送1，共11罐500元',drink180:'200元／包，買10送1，共11包2,000元',tests:'full_pass'},null,2)+'\n');
          NODE
          rm -f ci-last-error.txt
          git diff --check

      - name: Commit verified final state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -r --ignore-unmatch staging/line-v416-official-finalize staging/line-v415-finalize
          git rm --ignore-unmatch .github/workflows/line-v416-official-finalize.yml .github/workflows/line-v415-finalize.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(line): finalize official trial, catalog sync and full validation v416'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
