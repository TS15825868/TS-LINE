name: 仙加味正式站與 App 驗收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "production-deploy-request.json"
      - "line-sales-master.json"
      - "product-sales-master.js"
      - "social-weekly-schedule-override.js"
      - "social-review-only-mode.js"
      - "social-static-asset-bridge.js"
      - "social-final-posts.js"
      - "social-final-approved-batch.js"
      - "social-schedule-policy.js"
      - "social-schedule-repair-20260722.js"
      - "internal-social-site.js"
      - "internal-social-site/**"
      - ".github/workflows/production-health.yml"

permissions:
  contents: read

concurrency:
  group: xianjiawei-production-health
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and run complete local validation
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run check:catalog

      - name: Wait for Render and verify live functions
        shell: bash
        env:
          BASE_URL: https://ts-line.onrender.com
        run: |
          set -euo pipefail
          mkdir -p /tmp/xjw-production
          success=0
          for attempt in $(seq 1 96); do
            echo "Production weekly-once check $attempt/96"
            release_ok=0
            review_ok=0
            schedule_ok=0
            social_site_ok=0
            raster_ok=0
            internal_ok=0
            database_ok=0
            social_ok=0

            curl --connect-timeout 10 --max-time 65 --fail --silent --show-error "$BASE_URL/social/final-release-healthz?t=$(date +%s)" -o /tmp/xjw-production/release.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-production/release.json');if(h.ok!==true||Number(h.totalPosts)!==10||Number(h.fixedPosts)!==7||Number(h.weatherStandbyPosts)!==3||!Array.isArray(h.assets)||h.assets.length!==10||h.assets.some(a=>a.ok!==true||Number(a.width)!==1254||Number(a.height)!==1254))process.exit(1)" && release_ok=1 || true

            curl --connect-timeout 10 --max-time 45 --fail --silent --show-error "$BASE_URL/social/review-gate-status?t=$(date +%s)" -o /tmp/xjw-production/review.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-production/review.json');if(h.ok!==true||h.version!=='2026-07-25-review-gate-v4'||h.reviewRequiredBeforePublish!==true||h.automaticRetryEnabled!==false||Number(h.canonicalCount)!==10||Number(h.unreviewedActiveCount)!==0||h.overdueApprovalPolicy!=='move-to-next-free-wed-20:00')process.exit(1)" && review_ok=1 || true

            schedule_code=$(curl --connect-timeout 10 --max-time 45 --silent --show-error -o /tmp/xjw-production/schedule.json -w "%{http_code}" "$BASE_URL/social/schedule-status?t=$(date +%s)" || true)
            if [ "$schedule_code" = "200" ] || [ "$schedule_code" = "409" ]; then
              node -e "const h=require('/tmp/xjw-production/schedule.json');if(h.version!=='2026-07-25-v6'||Number(h.canonicalCount)!==10||h.rule?.fixed!=='每週1篇，週三 20:00'||!String(h.rule?.weatherException||'').includes('週末不發布')||(Array.isArray(h.issues)&&h.issues.length))process.exit(1)" && schedule_ok=1 || true
            fi

            curl --connect-timeout 10 --max-time 45 --fail --silent --show-error "$BASE_URL/internal/social-center-healthz?t=$(date +%s)" -o /tmp/xjw-production/social-site.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-production/social-site.json');if(h.ok!==true||h.mode!=='independent-website'||h.reviewRequiredBeforePublish!==true||h.automaticRetryEnabled!==false||h.inventoryApp!=='/internal/app'||h.socialWebsite!=='/internal/social-center')process.exit(1)" && social_site_ok=1 || true

            curl --connect-timeout 10 --max-time 90 --fail --silent --show-error "$BASE_URL/social/raster-healthz?t=$(date +%s)" -o /tmp/xjw-production/raster.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-production/raster.json');if(h.ok!==true||h.rasterText!==true||h.preventsGibberish!==true||h.contentVersion!=='social-raster-tc-v1'||h.targetSize!=='1254x1254')process.exit(1)" && raster_ok=1 || true

            curl --connect-timeout 10 --max-time 35 --fail --silent --show-error "$BASE_URL/internal/healthz?t=$(date +%s)" -o /tmp/xjw-production/internal.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-production/internal.json');if(h.ok!==true||h.app!=='仙加味內部管理 App')process.exit(1)" && internal_ok=1 || true
            curl --connect-timeout 10 --max-time 35 --fail --silent --show-error "$BASE_URL/internal/db-healthz?t=$(date +%s)" -o /tmp/xjw-production/database.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-production/database.json');if(h.ok!==true||h.storage!=='supabase')process.exit(1)" && database_ok=1 || true
            curl --connect-timeout 10 --max-time 35 --fail --silent --show-error "$BASE_URL/social/healthz?t=$(date +%s)" -o /tmp/xjw-production/social.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-production/social.json');if(h.ok!==true||h.instagramConfigured!==true||h.facebookConfigured!==true||Number(h.postCount)<10)process.exit(1)" && social_ok=1 || true

            if [ "$release_ok" -eq 1 ] && [ "$review_ok" -eq 1 ] && [ "$schedule_ok" -eq 1 ] && [ "$social_site_ok" -eq 1 ] && [ "$raster_ok" -eq 1 ] && [ "$internal_ok" -eq 1 ] && [ "$database_ok" -eq 1 ] && [ "$social_ok" -eq 1 ]; then
              success=1
              break
            fi
            sleep 15
          done

          if [ "$success" -ne 1 ]; then
            echo "Render production verification failed" >&2
            for file in release review schedule social-site raster internal database social; do
              echo "--- $file ---" >&2
              cat "/tmp/xjw-production/$file.json" 2>/dev/null || true
            done
            exit 1
          fi

          status=$(curl --connect-timeout 10 --max-time 30 --silent --output /tmp/xjw-production/login-body --dump-header /tmp/xjw-production/login-headers --write-out '%{http_code}' "$BASE_URL/internal/social-center?t=$(date +%s)")
          test "$status" = "302"
          tr -d '\r' < /tmp/xjw-production/login-headers | grep -qi '^location: /internal/login'
          echo "仙加味正式站、LINE OA、Internal、Supabase、社群待審與每週一篇排程均通過"
