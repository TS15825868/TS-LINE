name: 仙加味 LINE OA 完整驗收 20260913

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-line-verification-20260913.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xianjiawei-full-line-verification-20260913
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Full code and content guards
        run: |
          npm test
          npm run guard:full
          npm run security:audit

      - name: Verify current public master
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data.json','utf8'));
          if(!Array.isArray(d.products)||d.products.length!==6) throw new Error('LINE 對外產品數不是6');
          const t=JSON.stringify(d);
          const must=['龜鹿膏','100g','龜鹿飲30cc玻璃罐','30cc','龜鹿飲180cc鋁袋','180cc','龜鹿湯塊','75g','龜鹿膠','600g','鹿茸粉','75g'];
          for(const x of must) if(!t.includes(x)) throw new Error('data.json 缺少 '+x);
          if(t.includes('台興山產')) throw new Error('LINE 公開資料含舊品牌名');
          console.log('PASS LINE data.json formal authority');
          NODE

      - name: Verify live Render service
        shell: bash
        run: |
          set -euo pipefail
          base='https://ts-line.onrender.com'
          curl -LsS --retry 2 --retry-delay 5 --connect-timeout 20 --max-time 150 "$base/" -o live-root.json
          curl -LsS --retry 2 --retry-delay 5 --connect-timeout 20 --max-time 150 "$base/healthz" -o live-health.json
          node - <<'NODE'
          const fs=require('fs');
          const root=JSON.parse(fs.readFileSync('live-root.json','utf8'));
          const h=JSON.parse(fs.readFileSync('live-health.json','utf8'));
          if(root.ok!==true||root.service!=='仙加味 LINE OA') throw new Error('LINE root live 異常');
          if(h.ok!==true) throw new Error('LINE healthz live 異常');
          if(h.credentialsConfigured!==true) throw new Error('LINE credentialsConfigured=false');
          if(h.orderOpen!==true) throw new Error('LINE orderOpen=false');
          if(Number(h.productCount)!==6) throw new Error('LINE live productCount != 6');
          if(h.mascotAssetsReady!==true) throw new Error('LINE mascotAssetsReady=false');
          console.log('PASS LINE live',h.version,h.catalogVersion,h.productCount);
          NODE
          for asset in welcome recommend usage faq service; do
            url="https://raw.githubusercontent.com/TS15825868/TS-LINE/main/public/mascot/${asset}.jpg"
            code="$(curl -LsS --retry 2 --max-time 45 -o /tmp/mascot -w '%{http_code}' "$url")"
            test "$code" = '200'
            test -s /tmp/mascot
          done

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xianjiawei-full-line-verification-${{ github.run_id }}
          path: |
            live-root.json
            live-health.json
          if-no-files-found: error
          retention-days: 7
