name: 仙加味 LINE 正式媒體與銷售口徑同步

on:
  push:
    branches: [main]
    paths:
      - 'tools/sync-formal-line-media.py'
      - 'docs/FORMAL_MEDIA_POLICY_20260810.md'
      - '.github/workflows/sync-formal-line-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ts-line-formal-media-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply latest formal LINE media and copy
        run: python tools/sync-formal-line-media.py
      - name: Validate current capabilities and formal data
        shell: bash
        run: |
          test -f docs/FORMAL_MEDIA_POLICY_20260810.md
          test -f formal-line-media.json
          grep -Fq '30cc／罐（小玻璃罐、裸罐、無貼紙）' formal-line-media.json
          grep -Fq '180cc／包（鋁袋）' formal-line-media.json
          grep -Fq '75g／盒｜8塊裝' formal-line-media.json
          grep -Fq '600g／盒｜32塊裝' formal-line-media.json
          grep -Fq '60元／罐；買10送1，11罐600元' formal-line-media.json
          grep -Fq '200元／包；買10送1，11包2,000元' formal-line-media.json
          ! grep -R -F '30cc／瓶' --include='*.js' --include='*.json' --include='*.md' --include='*.html' .
          ! grep -R -F '早晚各一匙' --include='*.js' --include='*.json' --include='*.md' --include='*.html' .
          echo 'PASS: current LINE formal data validated without pinning legacy version strings.'
      - name: Run existing repo checks
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm install --ignore-scripts --no-audit --no-fund --no-package-lock
            npm test --if-present
          fi
      - name: Commit formal LINE sync
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'LINE formal media already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'deploy: sync latest approved DM trial and formal LINE copy'
          git push origin HEAD:main
