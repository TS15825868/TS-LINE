name: 仙加味 LINE 目前依賴鎖檔更新

# 維護用一次性同步：workflow 本身新增／修改時執行；
# package-lock.json 寫回不會再次觸發本 workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-package-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ts-line-package-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rebuild lockfile from current package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify current root dependency authority
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const root=lock.packages?.['']||{};
          if(pkg.version!=='6.1.4'||root.version!==pkg.version) throw new Error('root version is not synchronized');
          if(pkg.dependencies?.sharp!=='0.35.3'||root.dependencies?.sharp!=='0.35.3') throw new Error('sharp lock authority is not synchronized');
          if(root.dependencies?.['@line/bot-sdk']!==pkg.dependencies?.['@line/bot-sdk']) throw new Error('LINE SDK lock authority is not synchronized');
          console.log('PASS: package-lock root metadata follows current package.json.');
          NODE
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'maintenance: refresh LINE package lock from current dependencies'
          git push origin HEAD:main
