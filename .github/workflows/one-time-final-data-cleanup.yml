name: LINE OA單次正式資料清理

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event.issue.title == 'ONE_TIME_LINE_CLEANUP_RETRY_20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 清理LINE OA正式資料與舊來源
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          master_path = root / 'line-sales-master.json'
          data_path = root / 'data.json'
          master = json.loads(master_path.read_text(encoding='utf-8'))
          data = json.loads(data_path.read_text(encoding='utf-8'))

          old_jiao = '600g／盒（1斤）｜32塊裝｜每塊約18.75g'
          new_jiao = '600g（1斤）／盒｜32塊裝｜每塊約18.75g'
          drink_notice = '龜鹿飲為接單後安排製作加工；訂單資料與付款方式確認後，製作加工約需5～7個工作天，完成後才安排出貨，物流配送時間另計。'
          stock_notice = '本產品為預先製作備貨商品；訂單資料與付款方式確認後，依現貨狀況安排出貨，物流配送時間另計。'
          drink30_image = 'https://ts15825868.github.io/xianjiawei/images/products-v3/guilu-drink-30.jpg?v=20260805'

          replacements = [
            (old_jiao, new_jiao),
            ('600g／盒（1斤）', '600g（1斤）／盒'),
            ('龜鹿飲30cc玻璃瓶', '龜鹿飲30cc玻璃罐'),
            ('30cc／瓶（玻璃瓶）', '30cc／罐（小玻璃罐）'),
            ('30cc／瓶（小玻璃瓶）', '30cc／罐（小玻璃罐）'),
            ('30cc玻璃瓶', '30cc玻璃罐'),
            ('小玻璃瓶', '小玻璃罐'),
            ('guilu-drink-30-clean.svg', 'guilu-drink-30.jpg'),
            ('https://ts-line.onrender.com/assets/guilu-drink-30-clean.jpg?v=20260805', drink30_image),
            ('/assets/guilu-drink-30-clean.jpg?v=20260805', drink30_image),
            ('https://ts15825868.github.io/xianjiawei/images/guilu-drink-30cc-glass.jpg?v=412.2', drink30_image),
            ('門市取貨需先洽官方LINE確認', '配送方式請洽官方LINE確認'),
            ('門市資訊請透過官方LINE確認', '服務資訊請透過官方LINE確認'),
            ('假日服務與取貨請提前透過官方LINE確認。', '假日服務請提前透過官方LINE確認。'),
          ]

          def clean_text(value):
            text = str(value)
            for before, after in replacements:
              text = text.replace(before, after)
            text = text.replace('30cc玻璃罐與30cc玻璃罐', '30cc玻璃罐與180cc鋁袋')
            text = text.replace('30cc玻璃罐 vs 30cc玻璃罐', '30cc玻璃罐 vs 180cc鋁袋')
            text = text.replace('開瓶即飲', '開罐即飲')
            text = text.replace('開瓶即可飲用', '開罐即可飲用')
            return text

          def walk(value):
            if isinstance(value, str): return clean_text(value)
            if isinstance(value, list): return [walk(item) for item in value]
            if isinstance(value, dict): return {key: walk(item) for key, item in value.items()}
            return value

          master = walk(master)
          data = walk(data)
          master['version'] = '2026-08-05-canonical-v2'
          data['catalogVersion'] = '2026-08-05-canonical-v2'
          data.pop('store', None)
          data['shipping'] = ['宅配', '7-11店到店', '雙北親送']

          expected = {
            'guilu-gao': ('龜鹿膏','100g／罐','罐',1800,2100,'ready-stock',True),
            'guilu-drink-30': ('龜鹿飲30cc玻璃罐','30cc／罐（小玻璃罐）','罐',50,None,'made-to-order-drink',False),
            'guilu-drink-180': ('龜鹿飲180cc鋁袋','180cc／包（鋁袋）','包',200,None,'made-to-order-drink',False),
            'guilu-tangkuai': ('龜鹿湯塊','75g／盒｜8塊裝｜每塊約9.375g','盒',1600,None,'ready-stock',True),
            'guilu-jiao': ('龜鹿膠',new_jiao,'盒',9600,12000,'ready-stock',True),
            'luerong-fen': ('鹿茸粉','75g／罐','罐',2000,None,'ready-stock',True),
          }
          order = list(expected)

          current = master.get('products', {})
          products = {pid: dict(current.get(pid, {})) for pid in order}
          for pid, values in expected.items():
            name, spec, unit, price, original, fulfillment, ready = values
            product = products[pid]
            product.update({
              'name': name, 'displayName': name,
              'specification': spec, 'size': spec, 'spec': spec,
              'unit': unit, 'price': price, 'originalPrice': original,
              'quoteOnly': False,
              'fulfillmentType': fulfillment,
              'fulfillmentNotice': drink_notice if not ready else stock_notice,
              'productionLeadTime': '5～7個工作天' if not ready else None,
              'readyStock': ready,
            })
            if pid == 'guilu-drink-30':
              product.update({
                'aliases': ['龜鹿飲30cc','30cc','小玻璃罐','玻璃罐'],
                'offers': ['買10送1'],
                'priceText': '$50 / 罐',
                'priceLabel': '售價50元，買10送1（共11罐500元）',
                'image': drink30_image, 'imageUrl': drink30_image,
                'image_url': drink30_image, 'dmImage': drink30_image,
                'officialOriginalImage': drink30_image,
                'imagePolicy': 'official-original-contain-no-crop',
                'description': '30cc小玻璃罐，維持原有尺寸、裸罐、無貼紙，適合第一次接觸、外出攜帶與工作空檔安排。',
              })
            elif pid == 'guilu-drink-180':
              product.update({
                'offers': ['買10送1'],
                'priceText': '$200 / 包',
                'priceLabel': '售價200元，買10送1（共11包2,000元）',
              })
          master['products'] = products
          master['fulfillmentPolicy'] = {
            'version': '2026-08-05-v3',
            'drinkProductIds': ['guilu-drink-30','guilu-drink-180'],
            'readyStockProductIds': ['guilu-gao','guilu-tangkuai','guilu-jiao','luerong-fen'],
            'drinkNotice': drink_notice,
            'readyStockNotice': stock_notice,
          }
          trial = master.setdefault('trialCampaign', {})
          trial.update({
            'id': 'guilu-drink-30-evergreen-trial',
            'active': True, 'evergreen': True,
            'title': '龜鹿飲30cc試喝組',
            'contents': '30cc小玻璃罐×3罐',
            'productFee': 0, 'productFeeText': '試喝品免費',
            'fulfillmentRule': '資料及運費確認後安排製作加工，製作加工約需5～7個工作天；完成後才安排出貨，物流配送時間另計',
            'publicPrice': '龜鹿飲30cc售價50元／罐；買10送1，共11罐500元；180cc鋁袋單包200元，買10送1，共11包2,000元',
            'lineOnly': True, 'lineId': '@762jybnm',
            'lineUrl': 'https://lin.ee/sHZW7NkR',
          })
          allowed_combo_ids = ['daily-rhythm','table-pairing','full-experience']
          master['comboOffers'] = [item for item in master.get('comboOffers', []) if item.get('id') in allowed_combo_ids]

          by_id = {str(item.get('id')): dict(item) for item in data.get('products', []) if isinstance(item, dict)}
          data_products = []
          for pid in order:
            name, spec, unit, price, original, fulfillment, ready = expected[pid]
            item = by_id.get(pid, {})
            item.update({
              'id': pid, 'name': name, 'displayName': name,
              'specification': spec, 'size': spec, 'unit': unit,
              'price': price, 'fulfillmentType': fulfillment,
              'fulfillmentNotice': drink_notice if not ready else stock_notice,
              'productionLeadTime': '5～7個工作天' if not ready else None,
              'readyStock': ready,
            })
            if original is None: item.pop('originalPrice', None)
            else: item['originalPrice'] = original
            if pid == 'guilu-drink-30':
              item.update({
                'image': drink30_image, 'dmImage': drink30_image,
                'aliases': ['龜鹿飲30cc','30cc','玻璃罐','小玻璃罐'],
                'description': '30cc小玻璃罐，維持原有尺寸、裸罐、無貼紙。',
              })
            data_products.append(item)
          data['products'] = data_products
          data['offers'] = {'comboOffers': master['comboOffers']}
          data['trialCampaign'] = master['trialCampaign']
          data['fulfillmentPolicy'] = master['fulfillmentPolicy']
          data['runtime'] = {'contentApproval': {
            'mode': 'review-only', 'defaultStatus': 'pending_review',
            'scheduleRequiresApproval': True, 'publishRequiresApproval': True,
            'lineVoomManualOnly': True,
          }}

          master_path.write_text(json.dumps(master, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for path in root.rglob('*'):
            if not path.is_file() or path.suffix.lower() not in {'.js','.mjs','.json'}:
              continue
            if '.git' in path.parts or '.github' in path.parts or path.name.endswith('.test.js'):
              continue
            if path in {master_path, data_path}: continue
            text = path.read_text(encoding='utf-8', errors='ignore')
            updated = clean_text(text)
            if updated != text:
              path.write_text(updated, encoding='utf-8')

          for obsolete in [
            '.trigger-v4015','production-deploy-request.json','production-status.json',
            'production-schedule-status.json','APPLY_LINE_MASCOT_V400.txt','FIX_LINE_ASPECTMODE.txt',
          ]:
            path = root / obsolete
            if path.exists(): path.unlink()

          workflow_dir = root / '.github' / 'workflows'
          for path in workflow_dir.glob('*.y*ml'):
            if path.name not in {'ci.yml','one-time-final-data-cleanup.yml'}:
              path.unlink()

          checked = json.loads(master_path.read_text(encoding='utf-8'))
          assert list(checked['products']) == order and len(checked['products']) == 6
          assert checked['products']['guilu-drink-30']['specification'] == '30cc／罐（小玻璃罐）'
          assert checked['products']['guilu-drink-180']['specification'] == '180cc／包（鋁袋）'
          assert checked['products']['guilu-tangkuai']['specification'] == '75g／盒｜8塊裝｜每塊約9.375g'
          assert checked['products']['guilu-jiao']['specification'] == new_jiao
          assert len(checked['comboOffers']) == 3
          public = master_path.read_text(encoding='utf-8') + data_path.read_text(encoding='utf-8')
          for forbidden in ['龜鹿飲30cc玻璃瓶','30cc／瓶','小玻璃瓶','600g／盒（1斤）','guilu-drink-30-clean.svg','門市取貨需先洽官方LINE確認']:
            if forbidden in public: raise SystemExit(f'LINE正式資料仍含舊值：{forbidden}')
          PY

      - name: 提交資料清理並移除本流程
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-final-data-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(line): finalize canonical six-product data and remove obsolete sources'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 執行正式測試並保留診斷
        id: tests
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts --no-audit --no-fund > /tmp/line-test.log 2>&1
          install_result=$?
          if [ "$install_result" -eq 0 ]; then
            npm test >> /tmp/line-test.log 2>&1
            test_result=$?
          else
            test_result=$install_result
          fi
          set -e
          echo "result=$test_result" >> "$GITHUB_OUTPUT"
          tail -n 120 /tmp/line-test.log > /tmp/line-test-tail.log

      - name: 回寫測試結果並關閉Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          TEST_RESULT: ${{ steps.tests.outputs.result }}
        shell: bash
        run: |
          if [ "${TEST_RESULT:-1}" = '0' ]; then
            headline='LINE OA 正式資料清理與 npm test 全部通過'
          else
            headline='LINE OA 正式資料已提交；npm test 尚有舊契約需修正'
          fi
          {
            echo "## ${headline}"
            echo
            echo "- 清理提交已完成"
            echo "- 未核准貼文：未排程、未發布"
            echo "- 測試代碼：\`${TEST_RESULT:-unknown}\`"
            echo
            echo '<details><summary>測試輸出尾端</summary>'
            echo
            echo '```text'
            cat /tmp/line-test-tail.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } > /tmp/line-result.md
          gh issue comment "$NUMBER" --body-file /tmp/line-result.md || true
          gh issue close "$NUMBER" --reason completed || true
