name: 更新 LINE OA 圖片快取版本

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bump-lineoa-mascot-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 更新版本並移除一次性工作流
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('server.js')
          text = path.read_text(encoding='utf-8')
          old = 'const MASCOT_VERSION = "401.6-20260714";'
          new = 'const MASCOT_VERSION = "401.7-20260801-issue146";'
          if new not in text:
              if old not in text:
                  raise SystemExit('MASCOT_VERSION target not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/bump-lineoa-mascot-cache.yml
          git config user.name "仙加味自動修正"
          git config user.email "actions@users.noreply.github.com"
          git add server.js .github/workflows/bump-lineoa-mascot-cache.yml
          git commit -m "fix: refresh LINE OA Issue 146 image cache [skip ci]"
          git pull --rebase origin main
          git push origin main
