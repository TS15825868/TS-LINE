name: 驗證 LINE OA 主推與人工審核策略

on:
  push:
    branches: [main]
    paths:
      - 'data/marketing-priority.json'
      - '.github/workflows/verify-marketing-priority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 驗證 LINE OA 正式導流策略
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('data/marketing-priority.json', 'utf8'));
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          assert(p.primary_product?.id === 'PROD-GAO-100', 'LINE OA 主推商品必須為龜鹿膏 100g');
          assert(p.primary_product?.reply_priority === 1, '龜鹿膏回覆優先序必須為 1');
          assert(p.convenience_entry?.[0]?.id === 'PROD-DRINK-30', '第一便利入口必須為龜鹿飲 30cc');
          assert(p.convenience_entry?.[1]?.id === 'PROD-DRINK-180', '第二便利入口必須為龜鹿飲 180cc');
          assert(p.line_rules?.recommend_primary_product_first === true, 'LINE OA 必須先介紹主推商品');
          assert(p.line_rules?.offer_convenience_alternative === true, 'LINE OA 必須提供便利型替代');
          assert(p.line_rules?.medical_claims_forbidden === true, 'LINE OA 必須禁止療效文案');
          assert(p.line_rules?.medical_questions_handoff === '@changwuchi', '醫療問題必須導向合作中醫師');
          assert(p.post_rules?.approval_required === true, '貼文必須人工審核');
          assert(p.post_rules?.publish_before_approval === false, '未核准不得發布');
          console.log('LINE OA 主推導流、醫療轉交與人工審核策略驗證通過。');
          NODE