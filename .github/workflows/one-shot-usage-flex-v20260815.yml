name: 仙加味 LINE 20260815 使用方式一次性更新
# rerun-v4-capability-media-readiness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-usage-flex-v20260815.yml'
permissions:
  contents: write
jobs:
  update-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply current usage rules
        run: python tools/apply-usage-flex-v20260815.py
      - name: Run full LINE validation
        run: |
          npm install
          npm test
          npm run guard:full
      - name: Commit verified runtime changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/one-shot-usage-flex-v20260815.yml' ':!tools/apply-usage-flex-v20260815.py'
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m 'fix(line): use personal routine timing and 30cc 1-2 jars'
          git push origin HEAD:main
