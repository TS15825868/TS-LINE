name: 首批十篇貼文與Supabase最終整理

on:
  push:
    branches: [main]
    paths: [".github/workflows/final-social-canonical-repair.yml"]

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Keep only the ten canonical review posts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('runtime-social-stabilizer.js')
          text = runtime.read_text(encoding='utf-8')
          text = text.replace(
            '  const nonCanonical = incomingPosts.filter((post) => !CANONICAL_IDS.has(String(post.id || "")));\n',
            ''
          )
          text = text.replace(
            '    posts: [...nonCanonical, ...canonical].slice(-500),',
            '    posts: canonical,'
          )
          runtime.write_text(text, encoding='utf-8')

          entry = Path('internal-entry.js')
          text = entry.read_text(encoding='utf-8')
          old = '''  const officialSocialSchedule = rebuildOfficialSocialSchedule(
    readSocialStore,
    writeSocialStore
  );
  console.log("Official mascot pending-review social schedule rebuild", officialSocialSchedule);
'''
          new = '''  const currentSocialStore = readSocialStore();
  const { normalizeStore: normalizeCanonicalSocialStore } = require("./runtime-social-stabilizer");
  const canonicalSocialStore = normalizeCanonicalSocialStore(currentSocialStore, currentSocialStore);
  writeSocialStore(canonicalSocialStore);
  const canonicalPosts = (canonicalSocialStore.posts || []).filter((post) =>
    require("./runtime-social-stabilizer").CANONICAL_IDS.has(String(post.id || ""))
  );
  const officialSocialSchedule = {
    campaignId: "xjw-social-first-batch-10-v1",
    imageVersion: "social-final-qboss-1254-v1",
    preservedPublished: canonicalPosts.filter((post) => post.status === "published").length,
    removedUnpublished: 0,
    inserted: 0,
    updated: 0,
    pendingReview: canonicalPosts.filter((post) => post.status === "pending_review").length,
    activeTotal: canonicalPosts.length,
    firstAt: "",
    lastAt: "",
    signature: "2026-07-26-canonical-ten-lock-v3",
  };
  console.log("Canonical ten-post review schedule enforced", officialSocialSchedule);
'''
          if old not in text:
            raise SystemExit('internal-entry official rebuild block not found')
          entry.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify repository
        run: |
          npm ci
          npm test
          npm run check:catalog
      - name: Save repair to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-social-canonical-repair.yml
          git add runtime-social-stabilizer.js internal-entry.js
          git commit -m "固定Supabase社群資料只保留正式十篇待審"
          git pull --rebase origin main
          git push origin HEAD:main
