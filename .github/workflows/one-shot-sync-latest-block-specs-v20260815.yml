name: 仙加味 LINE 最新湯塊與龜鹿膠規格同步
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-sync-latest-block-specs-v20260815.yml'
permissions:
  contents: write
jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update current authorities and runtime rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          TANG_SPEC='75g （2兩）／盒｜8塊裝'; TANG_DETAIL='每塊約9.375g'
          JIAO_SPEC='600g （1斤）／盒｜32塊裝'; JIAO_DETAIL='每塊約18.75 g'
          DETAIL_RULE='顧客文字頁／FAQ／LINE文字回覆可顯示完整規格與每塊約重；產品圖、DM與貼文主圖仍依正式原圖，不自行加字'
          def load_json(path):
              p=Path(path); return p,json.loads(p.read_text(encoding='utf-8'))
          def save_json(p,data): p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p,a=load_json('assets/data/official-products.json'); a['version']='20260815-block-spec-2li-1jin-v3'; by={x['id']:x for x in a['products']}
          for pid,spec,detail in [('guilu-tangkuai',TANG_SPEC,TANG_DETAIL),('guilu-jiao',JIAO_SPEC,JIAO_DETAIL)]:
              by[pid]['specification']=spec; by[pid]['detailUnitApprox']=detail; by[pid]['detailUnitRule']=DETAIL_RULE
          new_rules=[]
          for r in a.get('guardRules',[]):
              if '龜鹿湯塊主圖與DM主規格' in r: new_rules.append('龜鹿湯塊文字規格為75g （2兩）／盒｜8塊裝，每塊約9.375g；產品圖與DM維持正式原圖，不自行加字')
              elif '龜鹿膠主圖與DM主規格' in r: new_rules.append('龜鹿膠文字規格為600g （1斤）／盒｜32塊裝，每塊約18.75 g；產品圖與DM維持正式原圖，不自行加字')
              elif '每塊約9.375g與18.75g只屬詳細資料' in r: new_rules.append('每塊約9.375g與18.75 g可在顧客文字產品資訊、FAQ與LINE文字回覆顯示')
              else: new_rules.append(r)
          a['guardRules']=new_rules; save_json(p,a)
          p,m=load_json('line-sales-master.json'); m['version']='2026-08-15-block-spec-2li-1jin-v4'
          for pid,spec,detail in [('guilu-tangkuai',TANG_SPEC,TANG_DETAIL),('guilu-jiao',JIAO_SPEC,JIAO_DETAIL)]:
              x=m['products'][pid]; x['specification']=spec; x['size']=spec; x['spec']=spec; x['detailUnitApprox']=detail; x['detailUnitRule']=DETAIL_RULE
          save_json(p,m)
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines(); binary_ext={'.png','.jpg','.jpeg','.webp','.avif','.gif','.ico','.zip','.pdf','.mp4','.mov','.woff','.woff2','.ttf','.otf'}
          for name in files:
              if name.startswith('.github/workflows/') or name in {'assets/data/official-products.json','line-sales-master.json'}: continue
              p=Path(name)
              if p.suffix.lower() in binary_ext or not p.is_file(): continue
              try:s=p.read_text(encoding='utf-8')
              except Exception:continue
              old=s
              s=s.replace('75g／盒｜8塊裝',TANG_SPEC).replace('600g（1斤）／盒｜32塊裝',JIAO_SPEC).replace('每塊約18.75g',JIAO_DETAIL)
              s=s.replace('僅詳細資料，不放產品圖、DM或貼文主規格',DETAIL_RULE).replace('僅詳細資料，不放產品圖或DM主規格',DETAIL_RULE)
              s=s.replace('includes("僅詳細資料")','includes("可顯示完整規格")')
              if s!=old:p.write_text(s,encoding='utf-8')
          def patch(path,pairs):
              p=Path(path);s=p.read_text(encoding='utf-8');old=s
              for x,y in pairs:s=s.replace(x,y)
              if s!=old:p.write_text(s,encoding='utf-8')
          patch('product-sales-master.js',[
            ('return {name:official.name,displayName:official.name,specification:spec,size:spec,spec,ingredients:official.ingredients||merged.ingredients,','return {name:official.name,displayName:official.name,specification:spec,size:spec,spec,ingredients:official.ingredients||merged.ingredients,...(String(official.detailUnitApprox||"").trim()?{detailUnitApprox:String(official.detailUnitApprox).trim()}:{}),'),
            ('  [/75g （2兩）／盒｜8塊裝｜每塊約9\\.375g/g, "75g （2兩）／盒｜8塊裝"],\n',''),
            ('  [/600g （1斤）／盒｜32塊裝｜每塊約18\\.75 g/g, "600g （1斤）／盒｜32塊裝"],\n','')
          ])
          helper='function productSpecText(product){const spec=String(product?.spec||product?.size||product?.specification||"").trim();const detail=String(product?.detailUnitApprox||"").trim();if(!detail||spec.includes(detail))return spec;return `${spec}，${detail}`;}'
          patch('server.js',[('function absoluteUrl(asset = "") {',helper+'\n\nfunction absoluteUrl(asset = "") {'),('${product.spec}','${productSpecText(product)}')])
          patch('line-plain-text-safety.js',[
            ('const POLICY_VERSION = "2026-08-14-current-authority-separated-media-health";','const POLICY_VERSION = "2026-08-15-current-authority-2li-1jin-health";'),
            ('guiluTangkuaiSpecification: "75g （2兩）／盒｜8塊裝",','guiluTangkuaiSpecification: "75g （2兩）／盒｜8塊裝",'),
            ('guiluTangkuaiDetailUnitApprox: "每塊約9.375g（僅詳細資料）",','guiluTangkuaiDetailUnitApprox: "每塊約9.375g（顧客文字可顯示）",'),
            ('guiluJiaoSpecification: "600g （1斤）／盒｜32塊裝",','guiluJiaoSpecification: "600g （1斤）／盒｜32塊裝",'),
            ('guiluJiaoDetailUnitApprox: "每塊約18.75 g（僅詳細資料）",','guiluJiaoDetailUnitApprox: "每塊約18.75 g（顧客文字可顯示）",')
          ])
          patch('line-health-authority.test.js',[
            ('assert.match(payload.guiluTangkuaiDetailUnitApprox, /9\\.375g.*僅詳細資料/);','assert.match(payload.guiluTangkuaiDetailUnitApprox, /9\\.375g.*顧客文字可顯示/);'),
            ('assert.match(payload.guiluJiaoDetailUnitApprox, /18\\.75g.*僅詳細資料/);','assert.match(payload.guiluJiaoDetailUnitApprox, /18\\.75 g.*顧客文字可顯示/);')
          ])
          PY
      - name: Install and rebuild current LINE runtime
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          node tools/sync_sales_master_current.js --write
      - name: Assert exact latest specs and customer text
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '75g （2兩）／盒｜8塊裝' assets/data/official-products.json
          grep -Fq '每塊約9.375g' data.json
          grep -Fq '600g （1斤）／盒｜32塊裝' assets/data/official-products.json
          grep -Fq '每塊約18.75 g' data.json
          grep -Fq 'function productSpecText' server.js
          grep -Fq '顧客文字可顯示' line-plain-text-safety.js
      - name: Validate LINE runtime and guards
        run: |
          node --check server.js
          node --check product-sales-master.js
          node --check tools/sync_sales_master_current.js
          node --check line-plain-text-safety.js
          npm test
          npm run guard:full
      - name: Commit verified current specs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then echo 'No runtime changes'; exit 0; fi
          git commit -m 'fix(line): sync 2兩 soup block and 1斤 guilu jiao specs'
          git push origin HEAD:main
