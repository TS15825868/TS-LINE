name: LINE OA 試喝與出貨規則正式同步

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/finalize-trial-production-lead-time-v415.mjs"
      - "tools/finalize-evergreen-trial-buy10get1-v412.mjs"
      - ".github/workflows/finalize-trial-production-lead-time-v415.yml"

permissions:
  contents: write

concurrency:
  group: line-trial-production-lead-time-v415
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply confirmed trial and promotion rules
        run: |
          node tools/apply-evergreen-trial-campaign.mjs
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node tools/finalize-trial-production-lead-time-v415.mjs
      - name: Verify source and full tests
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node test.js
          node catalog.test.js
          node function.test.js
          node line-order-cart.test.js
          node internal-inventory-seed.test.js
          node internal-order-pricing.test.js
          node internal-line-order-sync.test.js
          node - <<'NODE'
          const data = require('./data.json');
          const master = require('./line-sales-master.json');
          const official = '資料及運費確認後採接單安排製作，約5～7個工作天出貨；不含例假日及物流配送時間';
          for (const [name, source] of [['data', data], ['master', master]]) {
            if (source.trialCampaign?.fulfillmentRule !== official) throw new Error(`${name} 出貨規則不一致`);
          }
          const d30 = data.products.find((item) => item.id === 'guilu-drink-30');
          const d180 = data.products.find((item) => item.id === 'guilu-drink-180');
          if (d30?.offers?.[0]?.qty !== 11 || d30?.offers?.[0]?.total !== 500) throw new Error('30cc買10送1錯誤');
          if (d180?.offers?.[0]?.qty !== 11 || d180?.offers?.[0]?.total !== 2000) throw new Error('180cc買10送1錯誤');
          NODE
          git diff --check
      - name: Commit synchronized data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f ci-last-error.txt
          git add data.json line-sales-master.json package.json package-lock.json diagnostics/line-evergreen-trial-v412.json
          git add -u ci-last-error.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(line): persist verified trial and shipping rules'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
