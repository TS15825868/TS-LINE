name: 修正 LINE OA v6.0.7 驗收版本

on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-release-version-v607.yml"]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize release contract version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/release_check.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('assert.strictEqual(pkg.version, "6.0.6");', 'assert.strictEqual(pkg.version, "6.0.7");')
          text = text.replace('LINE OA v6.0.6售價', 'LINE OA v6.0.7售價')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f ci-last-error.txt
      - name: Verify complete repository
        run: |
          npm ci
          npm test
          npm run check:catalog
      - name: Save verified fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-release-version-v607.yml
          git add tools/release_check.js ci-last-error.txt 2>/dev/null || true
          git commit -m "修正LINE OA v6.0.7正式驗收契約"
          git pull --rebase origin main
          git push origin HEAD:main
