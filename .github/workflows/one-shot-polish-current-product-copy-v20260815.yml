name: 仙加味 LINE 目前產品文字最後一致化

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-polish-current-product-copy-v20260815.yml'

permissions:
  contents: write

jobs:
  polish-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply latest exact customer copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          changes={
            'assets/data/official-products.json':[
              ('每塊約9.375g與18.75g可在顧客文字產品資訊、FAQ與LINE文字回覆顯示','每塊約9.375g與每塊約18.75 g可在顧客文字產品資訊、FAQ與LINE文字回覆顯示')
            ],
            'line-sales-master.json':[
              ('75g深藍盒、8塊裝、每塊約9.375g；目前只有此一正式規格。','75g （2兩）／盒｜8塊裝，每塊約9.375g；深藍正式盒裝，目前只有此一正式規格。'),
              ('600g一斤淡紫盒、32塊裝，適合家庭大規格、熱水化開或燉湯。','600g （1斤）／盒｜32塊裝，每塊約18.75 g；淡紫色正式盒裝，適合家庭大規格、熱水化開或燉湯。'),
              ('熟悉龜鹿產品、偏好一斤大規格或家庭安排的人','熟悉龜鹿產品、偏好600g （1斤）大規格或家庭安排的人')
            ],
            'product-sales-master.js':[
              ('[/600g一斤淡紫盒/g, "600g（1斤）淡紫盒"],','[/600g一斤淡紫盒/g, "600g （1斤）淡紫盒"],'),
              ('[/一斤大規格/g, "600g（1斤）大規格"],','[/一斤大規格/g, "600g （1斤）大規格"],')
            ]
          }
          for rel,repls in changes.items():
              p=Path(rel); text=p.read_text(encoding='utf-8'); original=text
              for old,new in repls:
                  if old not in text:
                      raise SystemExit(f'{rel} 找不到預期目前文字：{old}')
                  text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')
              print('updated',rel)
          PY
      - name: Sync runtime and run full current release contracts
        shell: bash
        run: |
          set -euo pipefail
          node tools/sync_sales_master_current.js --write
          npm test
          npm run check:catalog
          npm run guard:full
          npm run security:audit
          node - <<'NODE'
          const fs=require('fs');
          const official=require('./assets/data/official-products.json');
          const master=require('./line-sales-master.json');
          const data=require('./data.json');
          const by=Object.fromEntries(official.products.map(x=>[x.id,x]));
          const runtime=Object.fromEntries(data.products.map(x=>[x.id,x]));
          if(by['guilu-tangkuai'].specification!=='75g （2兩）／盒｜8塊裝'||by['guilu-tangkuai'].detailUnitApprox!=='每塊約9.375g')throw new Error('龜鹿湯塊規格未對齊');
          if(by['guilu-jiao'].specification!=='600g （1斤）／盒｜32塊裝'||by['guilu-jiao'].detailUnitApprox!=='每塊約18.75 g')throw new Error('龜鹿膠規格未對齊');
          if(!master.products['guilu-tangkuai'].description.includes('75g （2兩）／盒｜8塊裝，每塊約9.375g'))throw new Error('湯塊產品介紹未顯示完整規格');
          if(!master.products['guilu-jiao'].description.includes('600g （1斤）／盒｜32塊裝，每塊約18.75 g'))throw new Error('龜鹿膠產品介紹未顯示完整規格');
          if(!runtime['guilu-jiao'].description.includes('600g （1斤）／盒｜32塊裝，每塊約18.75 g'))throw new Error('LINE runtime龜鹿膠產品介紹未同步');
          if(JSON.stringify(by['guilu-jiao']).includes('每塊約18.75g'))throw new Error('龜鹿膠目前權威仍含無空格舊格式');
          console.log('PASS: LINE產品介紹、目前權威與runtime皆使用最新完整湯塊／龜鹿膠規格。');
          NODE
      - name: Commit runtime mirror and clean helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/official-products.json line-sales-master.json product-sales-master.js data.json
          git rm .github/workflows/one-shot-polish-current-product-copy-v20260815.yml
          git diff --cached --check
          git commit -m 'fix(line): finalize current product specification copy'
          git pull --rebase origin main
          git push origin HEAD:main
