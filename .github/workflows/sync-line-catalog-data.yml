name: LINE OA 共用目錄自動同步

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'product-sales-master.js'
      - 'line-sales-master.json'
      - 'tools/sync_website_catalog.js'
      - 'tools/sync_sales_master.js'
      - '.github/workflows/sync-line-catalog-data.yml'

permissions:
  contents: write

env:
  TZ: Asia/Taipei

jobs:
  sync-and-commit:
    name: 重新產生並驗證 LINE OA 正式目錄
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取得正式 main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 設定 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 由官網目錄與售價主檔重新產生 data.json
        run: |
          node tools/sync_website_catalog.js --write
          node tools/sync_sales_master.js --write

      - name: 驗證重新產生後仍完全同步
        run: |
          node tools/sync_website_catalog.js --check
          node tools/sync_sales_master.js

      - name: 提交正式同步結果
        run: |
          if git diff --quiet -- data.json; then
            echo 'data.json 已是最新正式內容。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m 'fix(line): synchronize public catalog data with website source'
          git push origin HEAD:main
