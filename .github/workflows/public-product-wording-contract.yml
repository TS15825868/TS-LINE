name: LINE OA 公開產品名稱與規格驗證

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'line-sales-master.json'
      - 'data.json'
      - 'social-first-batch-202607.js'
      - 'social-final-reconcile.js'
      - 'public-product-wording-contract.test.js'
      - '.github/workflows/public-product-wording-contract.yml'

permissions:
  contents: read

jobs:
  wording-contract:
    name: 30cc玻璃罐、75g湯塊與600g龜鹿膠正式規格
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得正式 main
        uses: actions/checkout@v4

      - name: 設定 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 驗證公開名稱與正式規格
        run: node public-product-wording-contract.test.js
