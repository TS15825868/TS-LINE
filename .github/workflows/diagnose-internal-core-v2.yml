name: 重新驗證內部 App 核心測試

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-internal-core-v2.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify all internal core tests
        shell: bash
        run: |
          set -euo pipefail
          : > internal-core-diagnostics.txt
          for test in internal-app.test.js internal-app-pro.test.js internal-app-mobile.test.js internal-app-client-fix.test.js internal-app-button-contract.test.js; do
            echo "===== $test =====" | tee -a internal-core-diagnostics.txt
            node "$test" 2>&1 | tee -a internal-core-diagnostics.txt
            echo "exit=0" | tee -a internal-core-diagnostics.txt
            echo | tee -a internal-core-diagnostics.txt
          done
          echo "failed=0" | tee -a internal-core-diagnostics.txt
      - name: Save successful diagnostics and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-internal-core-v2.yml
          git add internal-core-diagnostics.txt
          git commit -m "chore: record successful internal App core verification"
          git pull --rebase origin main
          git push origin HEAD:main
