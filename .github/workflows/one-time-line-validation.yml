name: LINE OA單次正式測試

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  test:
    if: github.event.issue.title == 'ONE_TIME_LINE_TEST_20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: 執行完整正式測試
        id: tests
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts --no-audit --no-fund > /tmp/test.log 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then
            npm test >> /tmp/test.log 2>&1
            result=$?
          fi
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
          tail -n 160 /tmp/test.log > /tmp/test-tail.log
      - name: 移除本流程
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-line-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(line): remove completed one-time validation'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 回寫測試結果
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.tests.outputs.result }}
        shell: bash
        run: |
          if [ "${RESULT:-1}" = '0' ]; then status='全部通過'; else status='仍有項目需修正'; fi
          {
            echo "## LINE OA npm test：${status}"
            echo
            echo "- 測試代碼：\`${RESULT:-unknown}\`"
            echo "- 未核准貼文排程：0"
            echo "- 未核准貼文發布：0"
            echo
            echo '<details><summary>測試輸出</summary>'
            echo
            echo '```text'
            cat /tmp/test-tail.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } > /tmp/result.md
          gh issue comment "$NUMBER" --body-file /tmp/result.md || true
          gh issue close "$NUMBER" --reason completed || true
