name: 【暫停自動】LINE OA 六項產品與出貨政策手動驗證

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: official-products-line-manual
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 本地完整驗證
        id: local
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node tools/lock-confirmed-trial-shipping-v423.mjs
          node tools/normalize-official-products.mjs
          node tools/validate-official-products.mjs
          node line-product-fulfillment-safety.test.js
          npm test

      - name: 等待並驗證 Render 正式部署
        id: render
        if: steps.local.outcome == 'success'
        continue-on-error: true
        env:
          HEALTH_URL: https://ts-line.onrender.com/internal/api/v2/fulfillment-policy/healthz
          IMAGE_URL: https://ts-line.onrender.com/assets/guilu-drink-30-clean.jpg
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 60); do
            echo "Render verification attempt ${attempt}/60"
            if curl --connect-timeout 10 --max-time 30 -fsS "$HEALTH_URL" -o /tmp/fulfillment-health.json; then
              if node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('/tmp/fulfillment-health.json','utf8'));const d=['guilu-drink-30','guilu-drink-180'];const s=['guilu-gao','guilu-tangkuai','guilu-jiao','luerong-fen'];if(v.ok!==true||v.policyVersion!=='2026-08-05-v1'||JSON.stringify(v.drinkProductIds)!==JSON.stringify(d)||JSON.stringify(v.readyStockProductIds)!==JSON.stringify(s)||!String(v.drinkNotice||'').includes('5～7個工作天')||String(v.readyStockNotice||'').includes('5～7個工作天')||v.ownerReviewRequired!==true||v.unapprovedPostPublishingAllowed!==false||v.lineVoomManualOnly!==true)process.exit(1)"; then
                image_code=$(curl --connect-timeout 10 --max-time 45 -sS -o /tmp/guilu-drink-30-clean.jpg -w '%{http_code}' "$IMAGE_URL" || true)
                image_type=$(file -b --mime-type /tmp/guilu-drink-30-clean.jpg 2>/dev/null || true)
                image_size=$(wc -c </tmp/guilu-drink-30-clean.jpg 2>/dev/null || echo 0)
                if [ "$image_code" = "200" ] && [ "$image_type" = "image/jpeg" ] && [ "$image_size" -gt 10000 ]; then
                  success=1
                  break
                fi
              fi
            fi
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            echo 'Render did not expose the verified fulfillment policy and clean 30cc JPEG in time.' >&2
            exit 1
          fi

      - name: 更新出貨政策診斷 Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          set -euo pipefail
          title='[出貨政策診斷] 最新線上健康結果'
          checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          if [ "$LOCAL_OUTCOME" = "success" ] && [ "$RENDER_OUTCOME" = "success" ]; then
            result='success'
            headline='LINE OA 出貨政策與30cc圖片線上驗證成功'
          else
            result='failure'
            headline='LINE OA 出貨政策仍有未通過項目'
          fi
          cat > /tmp/issue-body.md <<EOF
          ## ${headline}

          - 結果：\`${result}\`
          - 提交：\`${GITHUB_SHA}\`
          - 執行網址：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 本地完整測試：\`${LOCAL_OUTCOME}\`
          - Render健康與正確圖片：\`${RENDER_OUTCOME}\`
          - 檢查時間：${checked_at}

          正式規則：龜鹿飲30cc與180cc採接單製作，製作加工約需5～7個工作天；龜鹿膏、龜鹿湯塊、龜鹿膠與鹿茸粉為預先製作備貨商品。未經逐張人工核准的貼文不可排程或發布，LINE VOOM維持人工發布。
          EOF
          number=$(gh issue list --state all --search "$title in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file /tmp/issue-body.md
            if [ "$result" = "success" ]; then
              gh issue close "$number" --reason completed || true
            else
              gh issue reopen "$number" || true
            fi
          else
            gh issue create --title "$title" --body-file /tmp/issue-body.md
          fi

      - name: 依驗證結果結束
        if: always()
        env:
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          test "$LOCAL_OUTCOME" = 'success'
          test "$RENDER_OUTCOME" = 'success'
