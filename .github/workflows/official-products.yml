name: 六項正式產品驗證

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/official-products.json'
      - 'config/official-products.json'
      - 'data.json'
      - 'line-sales-master.json'
      - 'product-sales-master.js'
      - 'server.js'
      - 'line-image-safety.js'
      - 'line-image-safety-core.js'
      - 'line-plain-text-safety.js'
      - 'line-product-fulfillment-safety.test.js'
      - 'tools/lock-confirmed-trial-shipping-v423.mjs'
      - 'tools/normalize-official-products.mjs'
      - 'tools/sync_sales_master.js'
      - 'tools/validate-official-products.mjs'
      - '.github/workflows/official-products.yml'

permissions:
  contents: read

concurrency:
  group: official-products-line-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 套用正式出貨政策
        run: node tools/lock-confirmed-trial-shipping-v423.mjs
      - name: 正規化六項正式產品
        run: node tools/normalize-official-products.mjs
      - name: 驗證六項正式產品
        run: node tools/validate-official-products.mjs
      - name: 驗證出貨說明與30cc圖片安全
        run: node line-product-fulfillment-safety.test.js
      - name: 執行 LINE OA 正式測試
        run: npm test
