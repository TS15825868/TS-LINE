name: 診斷目前本機測試與十篇待審缺一原因
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-current-v3.yml"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Record exact tests and canonical normalization
        shell: bash
        run: |
          set +e
          : > current-v3-diagnostics.txt
          for test in supabase-state-bridge.test.js persistence-auto-save.test.js runtime-social-stabilizer.test.js social-review-only-mode.test.js; do
            echo "===== $test =====" >> current-v3-diagnostics.txt
            node "$test" >> current-v3-diagnostics.txt 2>&1
            echo "exit=$?" >> current-v3-diagnostics.txt
          done
          echo "===== canonical =====" >> current-v3-diagnostics.txt
          node <<'NODE' >> current-v3-diagnostics.txt 2>&1
          const posts=require('./social-final-posts').POSTS;
          const batch=require('./social-final-approved-batch');
          const runtime=require('./runtime-social-stabilizer');
          const review=require('./social-review-only-mode');
          const ids=posts.map(p=>p.id);
          const normalized=runtime.normalizeStore({posts:[]},{posts:[]});
          const reset=review.initialReset(normalized);
          console.log(JSON.stringify({
            postsLength:posts.length,
            uniqueIds:new Set(ids).size,
            ids,
            batchLength:batch.POSTS.length,
            batchCanonicalIds:batch.CANONICAL_IDS?.size,
            runtimeCanonicalIds:runtime.CANONICAL_IDS?.size,
            normalizedCount:normalized.posts.length,
            normalizedIds:normalized.posts.map(p=>p.id),
            resetCount:reset.posts.length,
            resetPending:reset.posts.filter(p=>p.status==='pending_review').length,
          },null,2));
          NODE
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-current-v3.yml
          git add current-v3-diagnostics.txt
          git commit -m "chore: record current persistence and canonical diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
