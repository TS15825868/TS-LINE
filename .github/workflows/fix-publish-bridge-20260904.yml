name: 修正正式社群發布橋接

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-publish-bridge-20260904.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 掛載正式發布橋接
        run: python tools/patch_publish_bridge_mount_20260904.py
      - name: 驗證語法與路由
        run: |
          npm ci --no-audit --no-fund
          node --check server.js
          node --check erp-publish-bridge.js
          node - <<'NODE'
          const { app } = require('./server');
          const routes = (app._router?.stack || [])
            .filter(layer => layer.route)
            .map(layer => ({ path: layer.route.path, methods: layer.route.methods }));
          const post = routes.find(row => row.path === '/internal/api/v2/publish-bridge' && row.methods.post);
          const health = routes.find(row => row.path === '/internal/api/v2/publish-bridge/healthz' && row.methods.get);
          if (!post || !health) throw new Error('publish bridge routes are not mounted');
          console.log('publish bridge routes mounted');
          NODE
      - name: 提交正式修正並清理臨時檔
        run: |
          rm -f .github/workflows/fix-publish-bridge-20260904.yml tools/patch_publish_bridge_mount_20260904.py
          git config user.name 'TS15825868'
          git config user.email 'tung314069@gmail.com'
          git add server.js erp-publish-bridge.js .github/workflows/fix-publish-bridge-20260904.yml tools/patch_publish_bridge_mount_20260904.py
          git commit -m '掛載正式社群發布橋接'
          git push origin HEAD:main
