name: 官網目錄與 LINE 正式資料同步

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "line-sales-master.json"
      - "tools/sync_website_catalog.js"
      - "tools/sync_sales_master.js"
      - ".github/workflows/sync-catalog-main.yml"

permissions:
  contents: write

concurrency:
  group: xianjiawei-line-catalog-main
  cancel-in-progress: true

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align review-gate verification with v5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = "2026-07-25-review-gate-v4"
          new = "2026-07-26-review-gate-v5"
          for name in ["tools/release_check.js", ".github/workflows/final-verification.yml"]:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  print("updated", name)
          PY

      - name: Install exact dependencies
        run: npm ci

      - name: Synchronize website catalog and sales master
        run: npm run sync:catalog

      - name: Save synchronized production data and verification rules to main
        id: save
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "官網目錄、LINE 正式資料與待審安全規則已同步"
          else
            git commit -m "chore: synchronize catalog and align review gate v5 verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify synchronized catalog and complete release rules
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm run check:catalog
            npm test
          } 2>&1 | tee /tmp/catalog-sync-verify.log

      - name: Record catalog verification failure
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=$GITHUB_SHA"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat /tmp/catalog-sync-verify.log
          } > catalog-sync-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-sync-error.txt
          git commit -m "chore: record catalog synchronization verification failure"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Clear resolved catalog error
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f catalog-sync-error.txt ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm catalog-sync-error.txt
          git commit -m "chore: clear resolved catalog synchronization failure"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
