name: 仙加味最終完整驗收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "data.json"
      - "catalog-public.json"
      - "line-sales-master.json"
      - "product-sales-master.js"
      - "MASCOT_CHARACTER_SPEC.md"
      - "internal-app-client-fix.js"
      - "internal-social-site.js"
      - "internal-social-site/**"
      - "social-static-asset-bridge.js"
      - "social-final-posts.js"
      - "social-final-approved-batch.js"
      - "social-final-release-20260724.js"
      - "social-final-release-remote-assets.js"
      - "social-weekly-schedule-override.js"
      - "social-review-only-mode.js"
      - "social-schedule-policy.js"
      - "social-schedule-repair-20260722.js"
      - "social-publish-guard.js"
      - "social-current-policy.test.js"
      - "product-quote-only-guard.test.js"
      - "tools/release_check.js"
      - "tools/sync_website_catalog.js"
      - "tools/sync_sales_master.js"
      - ".github/workflows/final-verification.yml"

permissions:
  contents: read

concurrency:
  group: xianjiawei-final-verification
  cancel-in-progress: true

jobs:
  final-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify repository, catalog and official sales master
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run check:catalog
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const sales = require('./line-sales-master.json');
          if (pkg.version !== '6.1.1') throw new Error('LINE OA package version mismatch');
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) throw new Error('package-lock version mismatch');
          if (sales.version !== '2026-07-27-v5') throw new Error('sales master version mismatch');
          const expected = {
            'guilu-gao': { price: 1500, originalPrice: 1800 },
            'guilu-drink-30': { price: 50, offer: '買10送2' },
            'guilu-drink-180': { price: 200, offer: '買10送2' },
            'guilu-tangkuai': { price: 1600 },
            'luerong-fen': { price: 2000 },
            'guilu-jiao': { price: 9600, originalPrice: 12000, quoteOnly: false },
          };
          for (const [id, rule] of Object.entries(expected)) {
            const product = sales.products?.[id];
            if (!product || Number(product.price) !== rule.price) throw new Error(`${id} official price mismatch`);
            if (rule.originalPrice !== undefined && Number(product.originalPrice) !== rule.originalPrice) throw new Error(`${id} original price mismatch`);
            if (rule.offer && !product.offers?.includes(rule.offer)) throw new Error(`${id} offer mismatch`);
            if (rule.quoteOnly !== undefined && product.quoteOnly !== rule.quoteOnly) throw new Error(`${id} quoteOnly mismatch`);
          }
          if (sales.comboOffers?.length !== 3 || sales.combos?.length !== 3) throw new Error('three official combos are required');
          if (!sales.imagePolicy?.partners?.includes('小鹿娃娃') || !sales.imagePolicy?.partners?.includes('小烏龜娃娃')) throw new Error('mascot partners missing');
          if (sales.imagePolicy?.realProductImagesOnly !== true || sales.imagePolicy?.noProductRedraw !== true || sales.imagePolicy?.approvalRequiredBeforePublish !== true) throw new Error('image or review policy mismatch');
          console.log('正式售價、優惠、三組搭配、產品圖片與人工審核政策通過');
          NODE

      - name: Wait for Render and verify protected production state
        shell: bash
        env:
          BASE_URL: https://ts-line.onrender.com
        run: |
          set -euo pipefail
          mkdir -p /tmp/xjw-final
          success=0
          for attempt in $(seq 1 96); do
            echo "Production verification $attempt/96"
            release_ok=0
            review_ok=0
            schedule_ok=0
            social_site_ok=0
            raster_ok=0
            internal_ok=0
            database_ok=0
            social_ok=0

            curl --connect-timeout 10 --max-time 65 --fail --silent --show-error "$BASE_URL/social/final-release-healthz?t=$(date +%s)" -o /tmp/xjw-final/release.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-final/release.json');if(h.ok!==true||Number(h.totalPosts)!==10||Number(h.fixedPosts)!==7||Number(h.weatherStandbyPosts)!==3||!Array.isArray(h.assets)||h.assets.length!==10||h.assets.some(a=>a.ok!==true||Number(a.width)!==1254||Number(a.height)!==1254))process.exit(1)" && release_ok=1 || true

            curl --connect-timeout 10 --max-time 45 --fail --silent --show-error "$BASE_URL/social/review-gate-status?t=$(date +%s)" -o /tmp/xjw-final/review.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-final/review.json');if(h.ok!==true||h.version!=='2026-07-26-review-gate-v5'||h.reviewRequiredBeforePublish!==true||h.automaticRetryEnabled!==false||Number(h.canonicalCount)!==10||Number(h.unreviewedActiveCount)!==0||h.overdueApprovalPolicy!=='move-to-next-free-wed-20:00')process.exit(1)" && review_ok=1 || true

            schedule_code=$(curl --connect-timeout 10 --max-time 45 --silent --show-error -o /tmp/xjw-final/schedule.json -w "%{http_code}" "$BASE_URL/social/schedule-status?t=$(date +%s)" || true)
            if [ "$schedule_code" = "200" ] || [ "$schedule_code" = "409" ]; then
              node -e "const h=require('/tmp/xjw-final/schedule.json');if(h.version!=='2026-07-25-v6'||Number(h.canonicalCount)!==10||h.rule?.fixed!=='每週1篇，週三 20:00'||!String(h.rule?.weatherException||'').includes('週末不發布')||(Array.isArray(h.issues)&&h.issues.length))process.exit(1)" && schedule_ok=1 || true
            fi

            curl --connect-timeout 10 --max-time 45 --fail --silent --show-error "$BASE_URL/internal/social-center-healthz?t=$(date +%s)" -o /tmp/xjw-final/social-site.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-final/social-site.json');if(h.ok!==true||h.mode!=='independent-website'||h.reviewRequiredBeforePublish!==true||h.automaticRetryEnabled!==false||h.inventoryApp!=='/internal/app'||h.socialWebsite!=='/internal/social-center')process.exit(1)" && social_site_ok=1 || true

            curl --connect-timeout 10 --max-time 90 --fail --silent --show-error "$BASE_URL/social/raster-healthz?t=$(date +%s)" -o /tmp/xjw-final/raster.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-final/raster.json');if(h.ok!==true||h.rasterText!==true||h.preventsGibberish!==true||h.contentVersion!=='social-raster-tc-v1'||h.targetSize!=='1254x1254')process.exit(1)" && raster_ok=1 || true

            curl --connect-timeout 10 --max-time 35 --fail --silent --show-error "$BASE_URL/internal/healthz?t=$(date +%s)" -o /tmp/xjw-final/internal.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-final/internal.json');if(h.ok!==true||h.app!=='仙加味內部管理 App')process.exit(1)" && internal_ok=1 || true
            curl --connect-timeout 10 --max-time 35 --fail --silent --show-error "$BASE_URL/internal/db-healthz?t=$(date +%s)" -o /tmp/xjw-final/database.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-final/database.json');if(h.ok!==true||h.storage!=='supabase')process.exit(1)" && database_ok=1 || true
            curl --connect-timeout 10 --max-time 35 --fail --silent --show-error "$BASE_URL/social/healthz?t=$(date +%s)" -o /tmp/xjw-final/social.json 2>/dev/null && \
              node -e "const h=require('/tmp/xjw-final/social.json');if(h.ok!==true||h.instagramConfigured!==true||h.facebookConfigured!==true||Number(h.postCount)<10)process.exit(1)" && social_ok=1 || true

            if [ "$release_ok" -eq 1 ] && [ "$review_ok" -eq 1 ] && [ "$schedule_ok" -eq 1 ] && [ "$social_site_ok" -eq 1 ] && [ "$raster_ok" -eq 1 ] && [ "$internal_ok" -eq 1 ] && [ "$database_ok" -eq 1 ] && [ "$social_ok" -eq 1 ]; then
              success=1
              break
            fi
            sleep 15
          done

          if [ "$success" -ne 1 ]; then
            echo "Render production verification failed" >&2
            for file in release review schedule social-site raster internal database social; do
              echo "--- $file ---" >&2
              cat "/tmp/xjw-final/$file.json" 2>/dev/null || true
            done
            exit 1
          fi

          status=$(curl --connect-timeout 10 --max-time 30 --silent --output /tmp/xjw-final/login-body --dump-header /tmp/xjw-final/login-headers --write-out '%{http_code}' "$BASE_URL/internal/social-center?t=$(date +%s)")
          test "$status" = "302"
          tr -d '\r' < /tmp/xjw-final/login-headers | grep -qi '^location: /internal/login'
          echo "仙加味 LINE OA、社群待審、排程、素材、Internal App 與 Supabase 均通過"
