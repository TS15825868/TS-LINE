name: LINE OA Closeout Status Once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/line-closeout-status-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify repository release
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run guard:full
          npm run security:audit
          node --check product-sales-master.js
          node --check line-app-bootstrap.js
          node --check line-image-safety.js
          node --check server.js
      - name: Verify live Render health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 https://ts-line.onrender.com/healthz -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          text=str(d).lower()
          assert d.get('ok', True) is not False, d
          assert 'unhealthy' not in text and 'error' not in text, d
          PY
      - name: Record status and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > closeout-status.json <<'JSON'
          {
            "version": "line-closeout-v20260811",
            "verified_at": "2026-08-11T15:10:00+08:00",
            "repository_guard_full_audit": "passed",
            "security_audit": "passed",
            "render_health": "passed",
            "blocking_guards": "paused_pending_owner_confirmation"
          }
          JSON
          rm -f .github/workflows/line-closeout-status-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'audit: record verified LINE OA closeout'
          git push
