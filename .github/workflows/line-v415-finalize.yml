name: LINE OA 官網同步、試喝與正式驗收收尾 v415

on:
  push:
    branches: [main]
    paths:
      - staging/line-v415-finalize/READY
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: line-v415-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair catalog synchronization and official trial policy
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');

          function patch(path, replacements) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              if (!text.includes(from) && !text.includes(to)) {
                throw new Error(`${path} 找不到預期修正區塊：${from.slice(0, 80)}`);
              }
              text = text.split(from).join(to);
            }
            fs.writeFileSync(path, text);
          }

          patch('tools/sync_website_catalog.js', [[
`  const ids = (catalog.products || []).map((product) => product.id);
  if (JSON.stringify(ids) !== JSON.stringify(EXPECTED_IDS)) {
    throw new Error(\`共用目錄產品順序或品項不一致：\${ids.join(", ")}\`);
  }`,
`  const ids = (catalog.products || []).map((product) => product.id);
  const uniqueIds = new Set(ids);
  const actualIds = [...uniqueIds].sort();
  const expectedIds = [...EXPECTED_IDS].sort();
  if (uniqueIds.size !== ids.length || JSON.stringify(actualIds) !== JSON.stringify(expectedIds)) {
    throw new Error(\`共用目錄正式品項不一致：\${ids.join(", ")}\`);
  }`
          ], [
`async function fetchCatalog() {
  const url = process.env.CATALOG_URL || DEFAULT_CATALOG_URL;
  const response = await fetch(url, { headers: { "user-agent": "xianjiawei-lineoa-catalog-sync" } });
  if (!response.ok) throw new Error(\`無法下載共用目錄：HTTP \${response.status}\`);
  return response.json();
}`,
`async function fetchCatalog() {
  const url = process.env.CATALOG_URL || DEFAULT_CATALOG_URL;
  let lastError;
  for (let attempt = 1; attempt <= 3; attempt += 1) {
    try {
      const response = await fetch(url, { headers: { "user-agent": "xianjiawei-lineoa-catalog-sync" } });
      if (!response.ok) throw new Error(\`HTTP \${response.status}\`);
      return await response.json();
    } catch (error) {
      lastError = error;
      if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
    }
  }
  throw new Error(\`無法下載共用目錄（已重試3次）：\${lastError?.message || lastError}\`);
}`
          ]]);

          patch('catalog.test.js', [[
`assert.strictEqual(data.catalogVersion, "408.9");`,
`assert.match(String(data.catalogVersion || ''), /^\\d+\\.\\d+$/, 'catalogVersion must be a numeric release version');`
          ], [
`assert.deepStrictEqual(data.products.map((product) => product.id), expectedIds);`,
`assert.deepStrictEqual([...data.products.map((product) => product.id)].sort(), [...expectedIds].sort());
assert.strictEqual(new Set(data.products.map((product) => product.id)).size, expectedIds.length);`
          ]]);

          patch('tools/sync_sales_master.js', [[
`function hasBuyTenGetTwo(product, unitPrice) {`,
`function hasBuyTenGetOne(product, unitPrice) {`
          ], [
`    Number(offer.qty) === 12`,
`    Number(offer.qty) === 11`
          ], [
`    && String(offer.label) === "買10送2"`,
`    && String(offer.label) === "買10送1"`
          ], [
`    "guilu-gao": { price: 1500, originalPrice: 1800 },`,
`    "guilu-gao": { price: 1800, originalPrice: 2100 },`
          ], [
`{ price: 50, buyTenGetTwo: true }`,
`{ price: 50, buyTenGetOne: true }`
          ], [
`{ price: 200, buyTenGetTwo: true }`,
`{ price: 200, buyTenGetOne: true }`
          ], [
`    if (rule.buyTenGetTwo && !hasBuyTenGetTwo(product, rule.price)) {
      throw new Error(\`${id} 買10送2沒有轉成可正確計價的12入方案\`);
    }`,
`    if (rule.buyTenGetOne && !hasBuyTenGetOne(product, rule.price)) {
      throw new Error(\`${id} 買10送1沒有轉成可正確計價的11入方案\`);
    }`
          ], [
`module.exports = { stable, hasBuyTenGetTwo };`,
`module.exports = { stable, hasBuyTenGetOne };`
          ]]);

          patch('tools/finalize-evergreen-trial-buy10get1-v412.mjs', [[
`  fulfillmentRule: '資料及運費確認後安排製作加工，製作加工約需5～7個工作天；完成後才安排出貨，另加物流配送時間',`,
`  fulfillmentRule: '資料及運費確認後採接單安排製作，約5～7個工作天出貨；不含例假日及物流配送時間',`
          ], [
`pkg.description = '仙加味 LINE OA 正式版｜FB、IG與官網統一導入長期試喝與下單｜30cc三罐試喝品免費、運費自付｜30cc與180cc買10送1｜製作加工約5～7工作天，完成後出貨｜人工審核後發布';`,
`pkg.description = '仙加味 LINE OA 正式版｜FB、IG與官網統一導入長期試喝與下單｜30cc三罐試喝品免費、運費自付｜30cc與180cc買10送1｜接單後約5～7個工作天出貨｜人工審核後發布';`
          ]]);

          patch('tools/repair-evergreen-trial-tests.mjs', [[
`console.log('PASS：LINE OA測試已同步龜鹿膏2,100／1,800、30cc小玻璃罐、12罐500元及長期試喝入口。');`,
`console.log('PASS：LINE OA測試已同步龜鹿膏2,100／1,800、30cc小玻璃罐、11罐500元及長期試喝入口。');`
          ]]);

          patch('.github/workflows/catalog-sync.yml', [[
`          if git diff --quiet -- data.json package-lock.json; then`,
`          if git diff --quiet -- data.json line-sales-master.json package.json package-lock.json; then`
          ], [
`          git add data.json package-lock.json`,
`          git add data.json line-sales-master.json package.json package-lock.json`
          ], [
`          git pull --rebase origin main`,
`          git pull --rebase --autostash origin main`
          ]]);

          console.log('PASS：同步器已改為接受官網正式六品項、不因排序變動誤判，並鎖定買10送1。');
          NODE

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Synchronize current website catalog and sales master
        run: npm run sync:catalog

      - name: Run complete LINE OA validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node test.js
          node catalog.test.js
          node function.test.js
          node line-order-cart.test.js
          node internal-inventory-seed.test.js
          node internal-order-pricing.test.js
          node internal-line-order-sync.test.js

      - name: Verify official trial, price and product identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          const master = JSON.parse(fs.readFileSync('line-sales-master.json', 'utf8'));
          const byId = new Map(data.products.map((item) => [item.id, item]));
          const d30 = byId.get('guilu-drink-30');
          const d180 = byId.get('guilu-drink-180');
          if (!d30 || d30.name !== '龜鹿飲30cc玻璃罐' || d30.size !== '30cc／罐（小玻璃罐）' || d30.unit !== '罐') throw new Error('30cc小玻璃罐正式身分錯誤');
          if (d30.offers?.[0]?.qty !== 11 || d30.offers?.[0]?.total !== 500 || d30.offers?.[0]?.label !== '買10送1') throw new Error('30cc買10送1錯誤');
          if (!d180 || d180.offers?.[0]?.qty !== 11 || d180.offers?.[0]?.total !== 2000) throw new Error('180cc買10送1錯誤');
          if (data.trialCampaign?.contents !== '30cc小玻璃罐×3罐') throw new Error('試喝內容錯誤');
          if (!String(data.trialCampaign?.fulfillmentRule || '').includes('約5～7個工作天出貨')) throw new Error('試喝出貨說明錯誤');
          const serialized = JSON.stringify({data, master});
          for (const bad of ['買10送2', '共12罐500元', '共12包2,000元', '30cc／瓶（小玻璃瓶）']) {
            if (serialized.includes(bad)) throw new Error(`正式資料仍含舊內容：${bad}`);
          }
          fs.mkdirSync('diagnostics', {recursive: true});
          fs.writeFileSync('diagnostics/line-v415-final.json', JSON.stringify({
            status: 'success',
            checked_at: new Date().toISOString(),
            catalog_version: data.catalogVersion,
            products: data.products.map((item) => item.id),
            drink30: '50元／罐；買10送1，共11罐500元',
            drink180: '200元／包；買10送1，共11包2,000元',
            trial: '30cc小玻璃罐×3罐免費；運費自付；約5～7個工作天出貨',
            line_id: data.lineId,
            tests: 'full_pass'
          }, null, 2) + '\n');
          console.log('PASS：LINE OA 正式資料與完整測試全部通過。');
          NODE

      - name: Commit final LINE OA state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/sync_website_catalog.js tools/sync_sales_master.js tools/finalize-evergreen-trial-buy10get1-v412.mjs tools/repair-evergreen-trial-tests.mjs
          git add catalog.test.js .github/workflows/catalog-sync.yml data.json line-sales-master.json package.json package-lock.json diagnostics/line-v415-final.json
          git rm -r --ignore-unmatch staging/line-v415-finalize
          git rm --ignore-unmatch .github/workflows/line-v415-finalize.yml
          if git diff --cached --quiet; then
            echo 'No LINE OA changes.'
          else
            git commit -m 'fix(line): complete catalog sync and evergreen trial validation v415'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
