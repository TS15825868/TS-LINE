name: 仙加味76篇正式貼文同步LINE資料庫

on:
  push:
    branches: [main]
    paths:
      - 'data/social-content-v20260817.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch website formal authorities
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 3 'https://ts15825868.github.io/xianjiawei/images/posts/priority10-v20260817/manifest.json' -o /tmp/p10.json
          curl -fsSL --retry 6 --retry-delay 3 'https://ts15825868.github.io/xianjiawei/images/posts/remainder66-v20260817/manifest.json' -o /tmp/r66.json
      - name: Build exact 76-post LINE snapshot
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/p10.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/r66.json','utf8'));
          if(a.count!==10||a.posts?.length!==10)throw new Error('priority10 count');
          if(b.count!==66||b.posts?.length!==66)throw new Error('remainder66 count');
          const posts=[...a.posts,...b.posts];
          const ids=new Set(),titles=new Set(),copies=new Set(),images=new Set();
          for(const p of posts){
            if(ids.has(p.id)||titles.has(p.title)||copies.has(p.copy)||images.has(p.image_url))throw new Error(`duplicate ${p.id}`);
            if(!p.copy?.includes('仙加味'))throw new Error(`${p.id}: missing brand link`);
            if((p.title+p.copy+p.image_alt).includes('台興山產'))throw new Error(`${p.id}: blocked name`);
            ids.add(p.id);titles.add(p.title);copies.add(p.copy);images.add(p.image_url);
          }
          if(posts.length!==76||ids.size!==76||titles.size!==76||copies.size!==76||images.size!==76)throw new Error('76 uniqueness failed');
          const out={version:'2026-08-17-line-social-content-v1',brand:'仙加味',count:76,status:'pending_review_only',published_history_separate:true,authorities:[a.version,b.version],posts};
          fs.writeFileSync('data/social-content-current.json',JSON.stringify(out,null,2)+'\n');
          console.log('PASS LINE snapshot: 76 posts, unique title/copy/image, blocked name 0');
          NODE
      - name: Verify every image is live
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/images.txt
          const d=JSON.parse(require('fs').readFileSync('data/social-content-current.json','utf8'));
          for(const p of d.posts)console.log(p.image_url);
          NODE
          while IFS= read -r u; do curl -fsSL --retry 5 --retry-delay 2 -o /dev/null "$u"; done < /tmp/images.txt
      - name: Commit LINE content snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xianjiawei-line-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/social-content-current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(content): sync all 76 formal post assets to LINE'
          git push
