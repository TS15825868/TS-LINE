name: 仙加味社群待審與排程安全驗收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "production-deploy-request.json"
      - "line-sales-master.json"
      - "product-sales-master.js"
      - "social-weekly-schedule-override.js"
      - "social-review-only-mode.js"
      - "social-final-posts.js"
      - "social-final-approved-batch.js"
      - "social-schedule-policy.js"
      - "social-schedule-repair-20260722.js"
      - "social-publish-guard.js"
      - ".github/workflows/final-publish-status.yml"

permissions:
  contents: read

concurrency:
  group: xianjiawei-final-publish-status
  cancel-in-progress: true

jobs:
  verify-publish-status:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify local release before waiting for Render
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run check:catalog

      - name: Wait for production review gate and weekly schedule
        shell: bash
        env:
          BASE_URL: https://ts-line.onrender.com
        run: |
          set -euo pipefail
          mkdir -p /tmp/xjw-publish
          success=0
          for attempt in $(seq 1 96); do
            echo "Review-only publish-status check $attempt/96"
            review_code=$(curl --connect-timeout 10 --max-time 45 --silent --show-error -o /tmp/xjw-publish/review.json -w "%{http_code}" "$BASE_URL/social/review-gate-status?t=$(date +%s)" || true)
            schedule_code=$(curl --connect-timeout 10 --max-time 45 --silent --show-error -o /tmp/xjw-publish/schedule.json -w "%{http_code}" "$BASE_URL/social/schedule-status?t=$(date +%s)" || true)

            if [ "$review_code" = "200" ] && { [ "$schedule_code" = "200" ] || [ "$schedule_code" = "409" ]; }; then
              if node - <<'NODE'
          const review = require('/tmp/xjw-publish/review.json');
          const schedule = require('/tmp/xjw-publish/schedule.json');
          if (review.ok !== true || review.version !== '2026-07-26-review-gate-v5') throw new Error('review gate v5 not deployed');
          if (review.reviewRequiredBeforePublish !== true || review.automaticRetryEnabled !== false) throw new Error('review safety mismatch');
          if (Number(review.canonicalCount) !== 10 || Number(review.unreviewedActiveCount) !== 0) throw new Error('review queue mismatch');
          if (review.overdueApprovalPolicy !== 'move-to-next-free-wed-20:00') throw new Error('overdue approval policy mismatch');
          for (const post of review.posts || []) {
            const reviewed = Boolean(post.reviewApprovedAt);
            if (!reviewed && post.scheduledAt) throw new Error(`unreviewed post has schedule: ${post.id}`);
            if (!reviewed && post.autoPublishAfterReview === true) throw new Error(`unreviewed post has publish flag: ${post.id}`);
          }
          if (schedule.version !== '2026-07-25-v6') throw new Error('schedule v6 not deployed');
          if (Number(schedule.canonicalCount) !== 10) throw new Error('schedule count mismatch');
          if (schedule.rule?.fixed !== '每週1篇，週三 20:00') throw new Error('fixed schedule mismatch');
          if (!String(schedule.rule?.weatherException || '').includes('週末不發布')) throw new Error('weekend policy missing');
          if (Array.isArray(schedule.issues) && schedule.issues.length) throw new Error(schedule.issues.join('｜'));
          NODE
              then success=1; break; fi
            fi
            sleep 15
          done

          if [ "$success" -ne 1 ]; then
            echo 'Render 社群待審或排程安全驗收未通過' >&2
            echo '--- review ---' >&2
            cat /tmp/xjw-publish/review.json 2>/dev/null || true
            echo '--- schedule ---' >&2
            cat /tmp/xjw-publish/schedule.json 2>/dev/null || true
            exit 1
          fi

          echo '社群內容皆受人工審核保護，核准後每週三20:00排程，週末不發布。'
