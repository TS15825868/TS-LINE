name: ONE_TIME_UNIFY_TRIAL_CAMPAIGN_V414
run-name: LINE OA統一試喝文案與備援售價｜${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-unify-trial-campaign-v414.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-line-unify-trial-campaign-v414
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 統一LINE OA試喝資料、社群文案與備援售價
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const copy = `龜鹿飲試喝組｜先試喝，再決定

想先試喝，再決定是否適合自己的日常飲用方式嗎？

仙加味提供 龜鹿飲30cc試喝組：

3罐試喝品免費，運費自付

7-11店到店運費60元，郵局宅配運費100元。每位顧客、電話及地址限申請一次；接單後安排製作，約5～7個工作天出貨。

30cc小玻璃罐
正式售價 60元／罐
買10送1｜11罐600元

規格為30cc／罐，採小玻璃罐裸罐裝、無貼紙；開罐即可飲用，也可溫熱後飲用。

另有販售 180cc鋁袋：
單包200元
買10送1｜11包2,000元

所有試喝申請與正式下單，皆在 官方LINE 完成。歡迎加入LINE詢問。

仙加味
補養，是一種節奏。

#仙加味 #龜鹿飲 #龜鹿飲試喝組 #小玻璃罐 #試喝申請 #日常補養`;

          const posterUrl = 'https://ts15825868.github.io/xianjiawei/images/posts/approved-v413/guilu-drink-trial-60.svg';
          const payload = {
            version: '2026-08-06-trial-campaign-v1',
            title: '龜鹿飲試喝組｜先試喝，再決定',
            copy,
            platforms: ['Facebook', 'Instagram', 'LINE VOOM', 'Google 商家最新動態'],
            posterUrl,
            officialLine: { id: '@762jybnm', url: 'https://lin.ee/sHZW7NkR' },
            pricing: {
              guiluDrink30cc: '正式售價60元／罐｜買10送1｜11罐600元',
              guiluDrink180cc: '單包200元｜買10送1｜11包2,000元',
            },
            publishingSafety: {
              ownerReviewRequired: true,
              autoApprove: false,
              autoSchedule: false,
              autoPublish: false,
              lineVoomManualOnly: true,
            },
          };
          fs.writeFileSync('social-guilu-drink-trial-v1.json', JSON.stringify(payload, null, 2) + '\n');

          for (const file of ['line-sales-master.json', 'data.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.trialCampaign ||= {};
            Object.assign(data.trialCampaign, {
              title: payload.title,
              socialCopyVersion: payload.version,
              socialCopy: copy,
              posterUrl,
              contactLabel: '官方LINE',
              lineOnly: true,
              lineId: '@762jybnm',
              lineUrl: 'https://lin.ee/sHZW7NkR',
            });
            if (file === 'line-sales-master.json') data.version = '2026-08-06-canonical-v4';
            if (file === 'data.json') data.catalogVersion = '2026-08-06-canonical-v4';
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }

          let server = fs.readFileSync('server.js', 'utf8');
          const oldFallback = 'trial.publicPrice || "正式售價50元／罐；買10送1，共11罐500元"';
          const newFallback = 'trial.publicPrice || "龜鹿飲30cc正式售價60元／罐；買10送1，共11罐600元；180cc鋁袋單包200元，買10送1，共11包2,000元"';
          if (!server.includes(oldFallback) && !server.includes(newFallback)) {
            throw new Error('找不到LINE試喝舊備援售價');
          }
          server = server.replace(oldFallback, newFallback);
          fs.writeFileSync('server.js', server);

          fs.writeFileSync('social-trial-campaign-contract.test.js', `"use strict";\nconst fs=require("fs");\nconst c=require("./social-guilu-drink-trial-v1.json");\nconst m=require("./line-sales-master.json");\nconst d=require("./data.json");\nconst required=["3罐試喝品免費，運費自付","正式售價 60元／罐","買10送1｜11罐600元","單包200元","買10送1｜11包2,000元","皆在 官方LINE 完成"];\nfor(const value of required){if(!c.copy.includes(value))throw new Error("統一試喝文案缺漏："+value);}\nif(c.posterUrl!==m.trialCampaign.posterUrl||c.posterUrl!==d.trialCampaign.posterUrl)throw new Error("試喝海報網址未同步");\nif(c.copy!==m.trialCampaign.socialCopy||c.copy!==d.trialCampaign.socialCopy)throw new Error("試喝文案鏡像未同步");\nif(c.publishingSafety.autoPublish!==false||c.publishingSafety.lineVoomManualOnly!==true)throw new Error("發布安全鎖錯誤");\nconst server=fs.readFileSync("server.js","utf8");\nif(server.includes("正式售價50元／罐")||server.includes("共11罐500元"))throw new Error("LINE程式仍含50元備援舊資料");\nconsole.log("PASS：LINE OA統一試喝文案、海報、60元售價與人工發布安全鎖。")\n`);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!pkg.scripts.test.includes('node social-trial-campaign-contract.test.js')) {
            pkg.scripts.test += ' && node social-trial-campaign-contract.test.js';
          }
          pkg.description = '仙加味 LINE OA 正式版｜六項產品唯一主檔｜龜鹿飲30cc正式售價60元、買10送1共11罐600元｜三平台統一試喝文案與官方LINE｜未核准貼文禁止排程與發布';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: 執行LINE OA完整測試
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm test
          git diff --check

      - name: 提交正式更新並移除單次流程
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/one-time-unify-trial-campaign-v414.yml
          git add server.js line-sales-master.json data.json package.json social-guilu-drink-trial-v1.json social-trial-campaign-contract.test.js
          git commit -m 'feat(line): unify trial campaign copy poster and official LINE'
          git push origin HEAD:main
