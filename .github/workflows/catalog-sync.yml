name: 仙加味資料同步與驗收
run-name: 仙加味資料同步與驗收 v419｜${{ github.event_name }}｜${{ github.ref_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "data.json"
      - "line-sales-master.json"
      - "product-sales-master.js"
      - "server.js"
      - "test.js"
      - "function.test.js"
      - "line-order-cart.js"
      - "line-order-cart.test.js"
      - "internal-order-pricing.js"
      - "internal-order-pricing.test.js"
      - "internal-line-order-sync.js"
      - "internal-line-order-sync.test.js"
      - "internal-inventory-seed.js"
      - "internal-inventory-seed.test.js"
      - "social-server.js"
      - "social-approved-originals.js"
      - "social-final-reconcile.js"
      - "internal-app.js"
      - "internal-entry.js"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "catalog.test.js"
      - ".github/workflows/catalog-sync.yml"

permissions:
  contents: write

concurrency:
  group: xianjiawei-main-sync
  cancel-in-progress: false

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply confirmed trial, price and production rules
        run: |
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node tools/finalize-trial-production-lead-time-v415.mjs

      - name: Synchronize website catalog with retry
        id: catalog_sync
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          success=0
          for attempt in 1 2 3; do
            echo "Catalog synchronization attempt ${attempt}/3"
            if npm run sync:catalog 2>&1 | tee -a /tmp/xjw-sync.log; then
              success=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$success" -eq 1

      - name: Reapply confirmed rules after catalog synchronization
        if: steps.catalog_sync.outcome == 'success'
        run: |
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node tools/finalize-trial-production-lead-time-v415.mjs

      - name: Run complete release, cart and ERP order checks
        id: release_checks
        if: steps.catalog_sync.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm test &&
            node test.js &&
            node catalog.test.js &&
            node function.test.js &&
            node line-order-cart.test.js &&
            node internal-inventory-seed.test.js &&
            node internal-order-pricing.test.js &&
            node internal-line-order-sync.test.js
          } 2>&1 | tee /tmp/xjw-test.log

      - name: Verify final official contract
        id: final_contract
        if: steps.catalog_sync.outcome == 'success' && steps.release_checks.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node tools/finalize-trial-production-lead-time-v415.mjs
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['data.json','line-sales-master.json']) {
            const data = JSON.parse(fs.readFileSync(file,'utf8'));
            const text = JSON.stringify(data);
            if (!String(data.trialCampaign?.fulfillmentRule || '').includes('製作加工約需5～7個工作天')) throw new Error(`${file} 缺少製作加工天數`);
            if (!String(data.trialCampaign?.fulfillmentRule || '').includes('完成後才安排出貨')) throw new Error(`${file} 缺少完成後才出貨`);
            for (const bad of ['約5～7個工作天出貨','買10送2','共12罐500元','共12包2,000元','30cc／瓶（小玻璃瓶）']) {
              if (text.includes(bad)) throw new Error(`${file} 仍含舊內容：${bad}`);
            }
          }
          NODE
          git diff --check

      - name: Persist synchronized files and validation result
        if: always()
        shell: bash
        env:
          SYNC_RESULT: ${{ steps.catalog_sync.outcome }}
          CHECK_RESULT: ${{ steps.release_checks.outcome }}
          CONTRACT_RESULT: ${{ steps.final_contract.outcome }}
        run: |
          set -euo pipefail
          git config user.name "仙加味自動驗收"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SUCCESS=false
          if [ "$SYNC_RESULT" = success ] && [ "$CHECK_RESULT" = success ] && [ "$CONTRACT_RESULT" = success ]; then SUCCESS=true; fi

          if [ "$SUCCESS" = true ]; then
            rm -f ci-last-error.txt
            git add -A data.json line-sales-master.json server.js README.md package.json package-lock.json tools diagnostics ci-last-error.txt
          else
            {
              echo "commit=$(git rev-parse HEAD)"
              echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "workflow=${GITHUB_WORKFLOW}"
              echo "run_id=${GITHUB_RUN_ID}"
              echo "sync_result=${SYNC_RESULT}"
              echo "check_result=${CHECK_RESULT}"
              echo "contract_result=${CONTRACT_RESULT}"
              echo
              echo "=== catalog sync ==="
              tail -n 160 /tmp/xjw-sync.log 2>/dev/null || true
              echo
              echo "=== complete checks ==="
              tail -n 240 /tmp/xjw-test.log 2>/dev/null || true
            } > ci-last-error.txt
            git add ci-last-error.txt
          fi

          if ! git diff --cached --quiet; then
            if [ "$SUCCESS" = true ]; then
              git commit -m "chore(line): persist verified catalog and production lead time"
            else
              git commit -m "chore(line): persist validation failure diagnostics"
            fi
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi

      - name: Fail only after diagnostics are persisted
        if: always()
        shell: bash
        env:
          SYNC_RESULT: ${{ steps.catalog_sync.outcome }}
          CHECK_RESULT: ${{ steps.release_checks.outcome }}
          CONTRACT_RESULT: ${{ steps.final_contract.outcome }}
        run: |
          test "$SYNC_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$CONTRACT_RESULT" = success
