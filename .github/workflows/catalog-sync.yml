name: 仙加味資料同步與驗收
run-name: 仙加味資料同步與驗收 v423｜${{ github.event_name }}｜${{ github.ref_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "data.json"
      - "line-sales-master.json"
      - "product-sales-master.js"
      - "server.js"
      - "test.js"
      - "function.test.js"
      - "line-order-cart.js"
      - "line-order-cart.test.js"
      - "internal-order-pricing.js"
      - "internal-order-pricing.test.js"
      - "internal-order-sync.js"
      - "internal-line-order-sync.js"
      - "internal-line-order-sync.test.js"
      - "internal-inventory-seed.js"
      - "internal-inventory-seed.test.js"
      - "social-server.js"
      - "social-approved-originals.js"
      - "social-final-reconcile.js"
      - "internal-app.js"
      - "internal-entry.js"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "catalog.test.js"
      - ".github/workflows/catalog-sync.yml"

permissions:
  contents: write

concurrency:
  group: xianjiawei-main-sync-v423
  cancel-in-progress: true

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply one authoritative confirmed rule set
        run: node tools/lock-confirmed-trial-shipping-v423.mjs

      - name: Synchronize website catalog and formal sales master
        run: npm run sync:catalog

      - name: Reapply authoritative rules after synchronization
        run: node tools/lock-confirmed-trial-shipping-v423.mjs

      - name: Run complete LINE OA validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node test.js
          node catalog.test.js
          node function.test.js
          node line-order-cart.test.js
          node internal-inventory-seed.test.js
          node internal-order-pricing.test.js
          node internal-line-order-sync.test.js

      - name: Verify final public and ordering contract
        shell: bash
        run: |
          set -euo pipefail
          node tools/lock-confirmed-trial-shipping-v423.mjs
          node - <<'NODE'
          const fs = require('fs');
          const official = '資料及運費確認完成後採接單安排製作，約5～7個工作天出貨，不含例假日及物流配送時間';
          for (const file of ['data.json', 'line-sales-master.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const text = JSON.stringify(data);
            if (data.trialCampaign?.fulfillmentRule !== official) throw new Error(`${file} 出貨規則不一致`);
            for (const bad of ['製作加工約需5～7個工作天', '5～7個工作天只計製作加工', '買10送2', '共12罐500元', '共12包2,000元', '30cc／瓶（小玻璃瓶）']) {
              if (text.includes(bad)) throw new Error(`${file} 仍含舊內容：${bad}`);
            }
            const d30 = data.products?.find?.((item) => item.id === 'guilu-drink-30') || data.products?.['guilu-drink-30'];
            const d180 = data.products?.find?.((item) => item.id === 'guilu-drink-180') || data.products?.['guilu-drink-180'];
            if (!d30 || d30.name !== '龜鹿飲30cc玻璃罐' || d30.unit !== '罐') throw new Error(`${file} 30cc正式身分錯誤`);
            if (Array.isArray(d30.offers) && d30.offers[0]?.qty !== 11) throw new Error(`${file} 30cc買10送1錯誤`);
            if (d30.offer && d30.offer.qty !== 11) throw new Error(`${file} 30cc銷售母本買10送1錯誤`);
            if (!d180 || d180.name !== '龜鹿飲180cc鋁袋') throw new Error(`${file} 180cc正式身分錯誤`);
            if (Array.isArray(d180.offers) && d180.offers[0]?.qty !== 11) throw new Error(`${file} 180cc買10送1錯誤`);
            if (d180.offer && d180.offer.qty !== 11) throw new Error(`${file} 180cc銷售母本買10送1錯誤`);
          }
          NODE
          git diff --check

      - name: Persist verified synchronized files
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci-last-error.txt
          git config user.name "仙加味自動驗收"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(line): persist verified catalog and confirmed trial rules v423"
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi
