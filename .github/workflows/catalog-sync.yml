name: 仙加味資料同步與驗收
run-name: 仙加味資料同步與驗收 v421｜${{ github.event_name }}｜${{ github.ref_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "data.json"
      - "line-sales-master.json"
      - "product-sales-master.js"
      - "server.js"
      - "test.js"
      - "function.test.js"
      - "line-order-cart.js"
      - "line-order-cart.test.js"
      - "internal-order-pricing.js"
      - "internal-order-pricing.test.js"
      - "internal-order-sync.js"
      - "internal-line-order-sync.js"
      - "internal-line-order-sync.test.js"
      - "internal-inventory-seed.js"
      - "internal-inventory-seed.test.js"
      - "social-server.js"
      - "social-approved-originals.js"
      - "social-final-reconcile.js"
      - "internal-app.js"
      - "internal-entry.js"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "catalog.test.js"
      - ".github/workflows/catalog-sync.yml"

permissions:
  contents: write

concurrency:
  group: xianjiawei-main-sync
  cancel-in-progress: true

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply confirmed rules before synchronization
        run: |
          node tools/repair-evergreen-trial-tests.mjs
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node tools/finalize-trial-production-lead-time-v415.mjs

      - name: Synchronize website catalog
        run: npm run sync:catalog

      - name: Reapply confirmed rules after synchronization
        run: |
          node tools/repair-evergreen-trial-tests.mjs
          node tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node tools/finalize-trial-production-lead-time-v415.mjs

      - name: Run complete LINE OA validation
        run: |
          npm test
          node test.js
          node catalog.test.js
          node function.test.js
          node line-order-cart.test.js
          node internal-inventory-seed.test.js
          node internal-order-pricing.test.js
          node internal-line-order-sync.test.js

      - name: Verify final official contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['data.json','line-sales-master.json']) {
            const data = JSON.parse(fs.readFileSync(file,'utf8'));
            const text = JSON.stringify(data);
            const fulfillment = String(data.trialCampaign?.fulfillmentRule || '');
            if (!fulfillment.includes('製作加工約需5～7個工作天')) throw new Error(`${file} 缺少製作加工天數`);
            if (!fulfillment.includes('完成後才安排出貨')) throw new Error(`${file} 缺少完成後才出貨`);
            for (const bad of ['約5～7個工作天出貨','買10送2','共12罐500元','共12包2,000元','30cc／瓶（小玻璃瓶）']) {
              if (text.includes(bad)) throw new Error(`${file} 仍含舊內容：${bad}`);
            }
            const d30 = data.products?.find?.((item) => item.id === 'guilu-drink-30') || data.products?.['guilu-drink-30'];
            const d180 = data.products?.find?.((item) => item.id === 'guilu-drink-180') || data.products?.['guilu-drink-180'];
            if (d30 && Array.isArray(d30.offers) && d30.offers[0]?.qty !== 11) throw new Error(`${file} 30cc買10送1錯誤`);
            if (d180 && Array.isArray(d180.offers) && d180.offers[0]?.qty !== 11) throw new Error(`${file} 180cc買10送1錯誤`);
          }
          NODE
          git diff --check

      - name: Persist verified synchronized files
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci-last-error.txt
          git config user.name "仙加味自動驗收"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data.json line-sales-master.json server.js README.md package.json package-lock.json tools diagnostics ci-last-error.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(line): persist verified catalog and production-before-shipping rules"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
