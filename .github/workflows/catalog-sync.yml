name: 仙加味資料同步與驗收
run-name: 仙加味資料同步與驗收 v418｜${{ github.event_name }}｜${{ github.ref_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "data.json"
      - "line-sales-master.json"
      - "product-sales-master.js"
      - "server.js"
      - "test.js"
      - "function.test.js"
      - "line-order-cart.js"
      - "line-order-cart.test.js"
      - "internal-order-pricing.js"
      - "internal-order-pricing.test.js"
      - "internal-line-order-sync.js"
      - "internal-line-order-sync.test.js"
      - "internal-inventory-seed.js"
      - "internal-inventory-seed.test.js"
      - "social-server.js"
      - "social-approved-originals.js"
      - "social-final-reconcile.js"
      - "internal-app.js"
      - "internal-entry.js"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "catalog.test.js"
      - ".github/workflows/catalog-sync.yml"

permissions:
  contents: write

concurrency:
  group: xianjiawei-main-sync
  cancel-in-progress: false

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lock user-confirmed trial wording and package version
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const finalizerPath = 'tools/finalize-evergreen-trial-buy10get1-v412.mjs';
          let source = fs.readFileSync(finalizerPath, 'utf8');
          const official = '資料及運費確認完成後採接單安排製作，約5～7個工作天出貨，不含例假日及物流配送時間';
          source = source
            .replace(/const OFFICIAL_FULFILLMENT = '[^']*';/, `const OFFICIAL_FULFILLMENT = '${official}';`)
            .replace(/^const LEAD_TIME_DEFINITION = .*\n/m, '')
            .replace(/^\s*pkg\.version\s*=\s*['"][^'"]+['"];\s*\n/m, '')
            .replaceAll('製作加工約需5～7個工作天；完成後才安排出貨，物流配送時間另計', '約5～7個工作天出貨，不含例假日及物流配送時間')
            .replaceAll('製作加工約需5～7個工作天；完成後才安排出貨，另加物流配送時間', '約5～7個工作天出貨，不含例假日及物流配送時間');
          fs.writeFileSync(finalizerPath, source);

          const pkgPath = 'package.json';
          const lockPath = 'package-lock.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          pkg.version = lock.version;
          pkg.description = '仙加味 LINE OA 正式版｜30cc三罐試喝品免費、運費自付｜30cc與180cc買10送1｜接單後安排製作，約5～7個工作天出貨｜人工審核後發布';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          node --check tools/finalize-evergreen-trial-buy10get1-v412.mjs
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!==l.version)process.exit(1)"

      - name: Synchronize website catalog with retry
        id: catalog_sync
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          success=0
          for attempt in 1 2 3; do
            echo "Catalog synchronization attempt ${attempt}/3"
            if npm run sync:catalog 2>&1 | tee -a /tmp/xjw-sync.log; then
              success=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$success" -eq 1

      - name: Run complete release, cart and ERP order checks
        id: release_checks
        if: steps.catalog_sync.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm test &&
            node test.js &&
            node catalog.test.js &&
            node function.test.js &&
            node line-order-cart.test.js &&
            node internal-inventory-seed.test.js &&
            node internal-order-pricing.test.js &&
            node internal-line-order-sync.test.js
          } 2>&1 | tee /tmp/xjw-test.log

      - name: Persist synchronized files and validation result
        if: always()
        shell: bash
        env:
          SYNC_RESULT: ${{ steps.catalog_sync.outcome }}
          CHECK_RESULT: ${{ steps.release_checks.outcome }}
        run: |
          set -euo pipefail
          git config user.name "仙加味自動驗收"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SUCCESS=false
          if [ "$SYNC_RESULT" = success ] && [ "$CHECK_RESULT" = success ]; then SUCCESS=true; fi

          git add tools/finalize-evergreen-trial-buy10get1-v412.mjs package.json
          if [ "$SUCCESS" = true ]; then
            rm -f ci-last-error.txt
            git add -A ci-last-error.txt data.json line-sales-master.json package-lock.json
          else
            {
              echo "commit=$(git rev-parse HEAD)"
              echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "workflow=${GITHUB_WORKFLOW}"
              echo "run_id=${GITHUB_RUN_ID}"
              echo "sync_result=${SYNC_RESULT}"
              echo "check_result=${CHECK_RESULT}"
              echo
              echo "=== catalog sync ==="
              tail -n 160 /tmp/xjw-sync.log 2>/dev/null || true
              echo
              echo "=== complete checks ==="
              tail -n 240 /tmp/xjw-test.log 2>/dev/null || true
            } > ci-last-error.txt
            git add ci-last-error.txt
          fi

          if ! git diff --cached --quiet; then
            if [ "$SUCCESS" = true ]; then
              git commit -m "chore(line): persist verified catalog and clear resolved CI failure"
            else
              git commit -m "chore(line): persist confirmed trial rules and validation failure"
            fi
            for attempt in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi

      - name: Fail only after diagnostics are persisted
        if: always()
        shell: bash
        env:
          SYNC_RESULT: ${{ steps.catalog_sync.outcome }}
          CHECK_RESULT: ${{ steps.release_checks.outcome }}
        run: |
          test "$SYNC_RESULT" = success
          test "$CHECK_RESULT" = success
