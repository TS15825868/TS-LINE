name: 仙加味 LINE OA 相依套件鎖定同步
# security-refresh-20261001-axios

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/dependency-lock-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xianjiawei-lineoa-dependency-lock-sync
  cancel-in-progress: true

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Refresh package-lock from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply only nonbreaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts

      - name: Reject vulnerable body-parser in refreshed lockfile (CVE-2026-111181)
        shell: bash
        run: |
          set -euo pipefail
          # https://github.com/advisories/GHSA-27r3-jxmh-p828
          # Express 5 uses body-parser 2.x; 2.0.0–2.3.x are affected.
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const entry = lock.packages?.['node_modules/body-parser'];
          const version = entry?.version || '';
          const parts = version.split('.').map(Number);
          if (parts.length !== 3 || !parts.every(Number.isInteger) ||
              parts[0] !== 2 || parts[1] < 4 ||
              typeof entry.integrity !== 'string' || !entry.integrity.startsWith('sha512-') ||
              !/^https:\/\/registry\.npmjs\.org\/body-parser\/-\/body-parser-/.test(entry.resolved || '')) {
            throw new Error('body-parser remains vulnerable, unresolved or lacks a verified npm integrity hash');
          }
          console.log('PASS patched body-parser lockfile', version);
          NODE

      - name: Install exact refreshed dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run formal LINE OA checks
        run: npm test

      - name: Require zero moderate, high or critical production advisories
        run: npm audit --omit=dev --audit-level=moderate

      - name: Commit refreshed package-lock when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git commit -m "chore: apply safe LINE OA dependency audit fixes"
          git push origin HEAD:main
