name: 仙加味 LINE 目前龜鹿膠每塊約重格式同步

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-normalize-jiao-detail-spacing-v20260815.yml'

permissions:
  contents: write

jobs:
  normalize-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Normalize current LINE text authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          needle='每塊約18.75g'
          replacement='每塊約18.75 g'
          out=subprocess.check_output(['git','grep','-Il',needle,'--',':!images/**',':!assets/social-approved/**',':!.github/workflows/**'],text=True).splitlines()
          changed=[]
          for name in out:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              new=text.replace(needle,replacement)
              if new!=text:
                  p.write_text(new,encoding='utf-8')
                  changed.append(name)
          print('normalized files:', len(changed))
          for name in changed: print(name)
          if not changed:
              raise SystemExit('No current LINE text file required normalization')
          PY
      - name: Sync runtime and validate current LINE release
        shell: bash
        run: |
          set -euo pipefail
          node tools/sync_sales_master_current.js --write
          npm test
          npm run check:catalog
          npm run guard:full
          npm run security:audit
          node - <<'NODE'
          const fs=require('fs');
          const current=require('./assets/data/official-products.json');
          const data=require('./data.json');
          const by=Object.fromEntries(current.products.map(x=>[x.id,x]));
          const runtime=Object.fromEntries((data.products||[]).map(x=>[x.id,x]));
          if(by['guilu-tangkuai'].specification!=='75g （2兩）／盒｜8塊裝')throw new Error('湯塊主規格錯誤');
          if(by['guilu-tangkuai'].detailUnitApprox!=='每塊約9.375g')throw new Error('湯塊每塊約重錯誤');
          if(by['guilu-jiao'].specification!=='600g （1斤）／盒｜32塊裝')throw new Error('龜鹿膠主規格錯誤');
          if(by['guilu-jiao'].detailUnitApprox!=='每塊約18.75 g')throw new Error('龜鹿膠每塊約重錯誤');
          if(runtime['guilu-jiao']?.detailUnitApprox!=='每塊約18.75 g')throw new Error('LINE runtime龜鹿膠每塊約重未同步');
          for(const p of ['assets/data/official-products.json','line-sales-master.json','data.json','line-production-readiness.test.js']){
            if(fs.existsSync(p)&&fs.readFileSync(p,'utf8').includes('每塊約18.75g'))throw new Error(`${p}仍有無空格舊格式`);
          }
          console.log('PASS: LINE OA目前權威與runtime統一使用龜鹿膠每塊約18.75 g。');
          NODE
      - name: Commit normalized LINE authority and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/one-shot-normalize-jiao-detail-spacing-v20260815.yml
          git diff --cached --check
          git commit -m 'fix(line): align jiao detail weight with latest customer spec'
          git pull --rebase origin main
          git push origin HEAD:main
